<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="AI-generated news about AcreetionOS, tracked from GitHub, GitLab, and across the web."><meta name="theme-color" content="#2ecc71"><title>AcreetionOS News</title><link rel="icon" href="https://acreetionos.org/acreetionoslogo.webp"><link href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{--green:#2ecc71;--body-bg:#121212;--panel-bg:#1a1a1a;--box-bg:#222;--box-border:#333;--text-bright:#e5e5e5;--text:#b2b2b2;--purple:#9b59b6;--font-sans:'Roboto',sans-serif;--font-mono:'Fira Code',monospace}*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--font-sans);background:var(--body-bg);color:var(--text-bright);line-height:1.6;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,0.03) 1px,transparent 0);background-size:40px 40px}.header{background:rgba(24,26,27,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:2px solid var(--green);border-radius:0 0 16px 16px;position:sticky;top:0;z-index:100;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto}.header h1{font-family:var(--font-mono);font-size:1.5rem;color:var(--green)}.header a{color:var(--text);text-decoration:none;font-weight:500;margin-left:1.5rem}.header a:hover{color:var(--text-bright)}.container{max-width:1200px;margin:2rem auto;padding:0 2rem}.status-bar{text-align:center;padding:1rem;margin-bottom:2rem;background:var(--panel-bg);border:1px solid var(--box-border);border-radius:12px;color:var(--text);font-size:0.95rem}.status-bar .spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--box-border);border-top-color:var(--green);border-radius:50%;animation:spin 0.8s linear infinite;margin-right:0.5rem;vertical-align:middle}.status-bar .dot{color:var(--green);font-weight:700}.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:1.5rem;margin-top:1rem}.article{background:var(--box-bg);border:1px solid var(--box-border);border-radius:12px;overflow:hidden;transition:all 0.3s;opacity:0;transform:translateY(20px);animation:fadeIn 0.5s forwards}.article:hover{transform:translateY(-3px);box-shadow:0 8px 32px rgba(46,204,113,0.15);border-color:var(--green)}.article-body{padding:1.5rem}.tag{display:inline-block;padding:0.25rem 0.75rem;border-radius:12px;font-size:0.8rem;font-weight:700;margin-bottom:0.75rem}.tag-release{background:rgba(46,204,113,0.2);color:var(--green)}.tag-commit{background:rgba(97,175,239,0.2);color:#61afef}.tag-community{background:rgba(155,89,182,0.2);color:var(--purple)}.tag-infra{background:rgba(243,156,18,0.2);color:#f39c12}.article h3{font-size:1.1rem;margin-bottom:0.5rem;color:var(--text-bright)}.article p{color:var(--text);font-size:0.9rem;margin-bottom:0.75rem;line-height:1.5}.article-meta{display:flex;justify-content:space-between;align-items:center;font-size:0.8rem;color:var(--text);padding-top:0.75rem;border-top:1px solid var(--box-border)}.article-meta a{color:var(--green);text-decoration:none;font-weight:600}.article-meta a:hover{text-decoration:underline}.refresh-btn{display:block;margin:2rem auto 0;padding:0.6rem 1.5rem;background:var(--green);color:#000;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-family:var(--font-sans);font-size:1rem;transition:all 0.2s}.refresh-btn:hover{transform:translateY(-2px);box-shadow:0 0 15px rgba(46,204,113,0.4)}.refresh-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none}.error-box{background:rgba(255,0,0,0.1);border:1px solid rgba(255,0,0,0.3);border-radius:12px;padding:1.5rem;text-align:center;color:#ff6b6b;margin-bottom:1.5rem}.footer{text-align:center;padding:2rem;margin-top:2rem;border-top:1px solid var(--box-border);color:var(--text);font-size:0.9rem}.footer a{color:var(--green);text-decoration:none}.footer a:hover{text-decoration:underline}@keyframes spin{to{transform:rotate(360deg)}}@keyframes fadeIn{to{opacity:1;transform:translateY(0)}}::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:var(--body-bg)}::-webkit-scrollbar-thumb{background:var(--box-border);border-radius:10px}::-webkit-scrollbar-thumb:hover{background:var(--green)}@media(max-width:768px){.header{flex-direction:column;gap:0.75rem;padding:0.75rem 1rem}.container{padding:0 1rem}.news-grid{grid-template-columns:1fr}}</style></head><body><header class="header"><h1><span id="title-text">AcreetionOS News</span></h1><nav><a href="https://acreetionos.org">Home</a><a href="https://acreetionos.org/developers.html">Developers</a></nav></header><div class="container"><div class="status-bar" id="status-bar"><span class="spinner"></span><span id="status-text">Fetching latest activity from GitHub and GitLab...</span></div><div id="error-container"></div><h2 style="font-family:var(--font-mono);color:var(--green);margin-bottom:1rem">Latest Updates</h2><div class="news-grid" id="news-grid"></div><button class="refresh-btn" id="refresh-btn" onclick="fetchNews()">Refresh News</button></div><footer class="footer"><p>Powered by AI — tracking <a href="https://github.com/AcreetionOS-Code">GitHub</a> and <a href="https://gitlab.acreetionos.org">GitLab</a>. Part of the <a href="https://acreetionos.org">AcreetionOS</a> project.</p><p>&copy; 2026 AcreetionOS Project</p></footer><script>const GH_ORG='AcreetionOS-Code';const GL_URL='https://gitlab.acreetionos.org';const AI_URL='https://aiden.acreetionos.org/api/chat';const REPOS=['acreetionos-code.github.io'];const statusEl=document.getElementById('status-bar');const statusText=document.getElementById('status-text');const gridEl=document.getElementById('news-grid');const errorEl=document.getElementById('error-container');const titleEl=document.getElementById('title-text');function setStatus(msg,loading=true){statusText.textContent=msg;if(loading){statusEl.innerHTML='<span class="spinner"></span><span id="status-text">'+msg+'</span>'}else{statusEl.innerHTML='<span class="dot">&#10003;</span> <span id="status-text">'+msg+'</span>'}}function showError(msg){errorEl.innerHTML='<div class="error-box">'+msg+'</div>'}function clearError(){errorEl.innerHTML=''}async function fetchGitHubActivity(){const results=[];try{const reposRes=await fetch('https://api.github.com/orgs/'+GH_ORG+'/repos?per_page=10&sort=pushed');if(!reposRes.ok)throw new Error('GitHub org fetch failed');const repos=await reposRes.json();for(const repo of repos.slice(0,5)){try{const commitsRes=await fetch('https://api.github.com/repos/'+GH_ORG+'/'+repo.name+'/commits?per_page=3');if(commitsRes.ok){const commits=await commitsRes.json();for(const c of commits){results.push({type:'commit',repo:repo.name,message:c.commit.message.split('\n')[0],author:c.commit.author.name||'Unknown',date:c.commit.author.date,url:c.html_url,sha:c.sha.slice(0,7)})}}const releasesRes=await fetch('https://api.github.com/repos/'+GH_ORG+'/'+repo.name+'/releases?per_page=2');if(releasesRes.ok){const releases=await releasesRes.json();for(const r of releases){results.push({type:'release',repo:repo.name,name:r.tag_name,desc:r.body?r.body.split('\n')[0]:'',author:r.author?r.author.login:'Unknown',date:r.published_at||r.created_at,url:r.html_url})}}catch(e){}}return results}catch(e){console.error('GitHub fetch error:',e);return results}}async function fetchGitLabActivity(){const results=[];try{const projectsRes=await fetch(GL_URL+'/api/v4/projects?per_page=10&order_by=last_activity_at');if(!projectsRes.ok)throw new Error('GitLab fetch failed');const projects=await projectsRes.json();for(const proj of projects.slice(0,5)){try{const commitsRes=await fetch(GL_URL+'/api/v4/projects/'+proj.id+'/repository/commits?per_page=3');if(commitsRes.ok){const commits=await commitsRes.json();for(const c of commits){results.push({type:'commit',repo:proj.path_with_namespace||proj.name,message:c.title||c.message,author:c.author_name||'Unknown',date:c.created_at,url:c.web_url||(GL_URL+'/'+proj.path_with_namespace+'/-/commit/'+c.id),sha:c.short_id})}}}catch(e){}}return results}catch(e){console.error('GitLab fetch error:',e);return results}}function formatDate(d){try{return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch(){return d||'Unknown'}}async function generateArticles(data){if(data.length===0){setStatus('No recent activity found',false);return[{tag:'Community',tagClass:'tag-community',title:'No Recent Activity',desc:'Check back soon for the latest AcreetionOS news and updates.',url:'https://acreetionos.org',source:'acreetionos.org',date:''}]}const activityText=data.map(d=>{if(d.type==='release')return'[RELEASE] '+d.repo+' - '+d.name+': '+d.desc;return'[COMMIT] '+d.repo+' - '+d.message+' (by '+d.author+')'}).join('\n');const messages=[{role:'system',content:'You are an AI news writer for the AcreetionOS Linux distribution project. Given raw activity data from GitHub and GitLab, write 3-6 concise news articles. Each article must have: a title (max 60 chars), a 1-2 sentence summary, a category tag (Release, Development, Community, or Infrastructure), and a relevance score from 1-10. Respond with ONLY a valid JSON array of objects, each with keys: title, summary, tag (Release/Development/Community/Infrastructure), url (use the most relevant URL from the data). Do not wrap in markdown.'},{role:'user',content:'Here is the recent AcreetionOS project activity:\n'+activityText}];try{setStatus('AI is generating articles from activity data...');const res=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})});if(!res.ok){const err=await res.json();throw new Error(err.error||'AI generation failed')}const aiData=await res.json();let content=aiData.content||'';content=content.replace(/```json\s*/gi,'').replace(/```\s*$/,'').trim();const articles=JSON.parse(content);if(!Array.isArray(articles))throw new Error('Invalid response format');return articles.map(a=>({title:a.title||'Untitled',desc:a.summary||a.desc||'',tag:a.tag||'Development',tagClass:'tag-'+((a.tag||'dev').toLowerCase().includes('release')?'release':(a.tag||'dev').toLowerCase().includes('community')?'community':(a.tag||'dev').toLowerCase().includes('infra')?'infra':'commit'),url:a.url||'https://acreetionos.org',source:'AI Generated',date:new Date().toISOString()}))}catch(e){console.error('AI generation error:',e);setStatus('AI generation failed, showing raw activity',false);return data.slice(0,8).map(d=>({title:d.type==='release'?d.name:d.message.slice(0,60),desc:d.type==='release'?d.desc:'Commit by '+d.author,tag:d.type==='release'?'Release':'Development',tagClass:d.type==='release'?'tag-release':'tag-commit',url:d.url||'https://acreetionos.org',source:d.repo,date:d.date}))}}function renderArticles(articles){gridEl.innerHTML='';articles.forEach((a,i)=>{const card=document.createElement('div');card.className='article';card.style.animationDelay=(i*0.1)+'s';card.innerHTML='<div class="article-body"><span class="tag '+a.tagClass+'">'+a.tag+'</span><h3>'+a.title+'</h3><p>'+a.desc+'</p><div class="article-meta"><span>'+a.source+' • '+formatDate(a.date)+'</span><a href="'+a.url+'" target="_blank" rel="noopener">Read More</a></div></div>';gridEl.appendChild(card)})}async function fetchNews(){clearError();const btn=document.getElementById('refresh-btn');btn.disabled=true;setStatus('Fetching latest activity from GitHub and GitLab...');try{const[gh,gl]=await Promise.all([fetchGitHubActivity(),fetchGitLabActivity()]);const allData=[...gh,...gl].sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));setStatus('Found '+allData.length+' activities. Generating news articles with AI...');const articles=await generateArticles(allData);renderArticles(articles);const latest=allData[0];setStatus('Updated '+formatDate(latest?latest.date:new Date().toISOString()),false)}catch(e){console.error('Error:',e);setStatus('Failed to fetch news',false);showError('Could not fetch news data. Make sure you are on acreetionos.org or localhost.')}finally{document.getElementById('refresh-btn').disabled=false}}fetchNews();</script></body></html>
