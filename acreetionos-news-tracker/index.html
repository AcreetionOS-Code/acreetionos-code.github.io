<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Latest news about AcreetionOS — tracked from GitHub, GitLab, and the web."><meta name="theme-color" content="#2ecc71"><title>AcreetionOS News</title><link rel="icon" href="https://acreetionos.org/acreetionoslogo.webp"><link href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{--green:#2ecc71;--body-bg:#121212;--panel-bg:#1a1a1a;--box-bg:#222;--box-border:#333;--text-bright:#e5e5e5;--text:#b2b2b2;--purple:#9b59b6;--font-sans:'Roboto',sans-serif;--font-mono:'Fira Code',monospace}*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--font-sans);background:var(--body-bg);color:var(--text-bright);line-height:1.6;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,0.03) 1px,transparent 0);background-size:40px 40px}.header{background:rgba(24,26,27,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:2px solid var(--green);border-radius:0 0 16px 16px;position:sticky;top:0;z-index:100;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto}.header h1{font-family:var(--font-mono);font-size:1.5rem;color:var(--green)}.header a{color:var(--text);text-decoration:none;font-weight:500;margin-left:1.5rem}.header a:hover{color:var(--text-bright)}.container{max-width:1200px;margin:2rem auto;padding:0 2rem}.status-bar{text-align:center;padding:1rem;margin-bottom:2rem;background:var(--panel-bg);border:1px solid var(--box-border);border-radius:12px;color:var(--text);font-size:0.9rem}.status-bar .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--box-border);border-top-color:var(--green);border-radius:50%;animation:spin 0.8s linear infinite;margin-right:0.5rem;vertical-align:middle}.status-bar .dot{color:var(--green);font-weight:700}.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:1.25rem;margin-top:1rem}.article{background:var(--box-bg);border:1px solid var(--box-border);border-radius:12px;overflow:hidden;transition:all 0.3s;opacity:0;transform:translateY(20px);animation:fadeIn 0.4s forwards}.article:hover{transform:translateY(-3px);box-shadow:0 8px 32px rgba(46,204,113,0.15);border-color:var(--green)}.article-body{padding:1.25rem}.tag{display:inline-block;padding:0.2rem 0.7rem;border-radius:12px;font-size:0.75rem;font-weight:700;margin-bottom:0.6rem}.tag-release{background:rgba(46,204,113,0.2);color:var(--green)}.tag-commit{background:rgba(97,175,239,0.2);color:#61afef}.tag-community{background:rgba(155,89,182,0.2);color:var(--purple)}.tag-infra{background:rgba(243,156,18,0.2);color:#f39c12}.article h3{font-size:1.05rem;margin-bottom:0.4rem;color:var(--text-bright)}.article p{color:var(--text);font-size:0.85rem;margin-bottom:0.6rem;line-height:1.45}.article-meta{display:flex;justify-content:space-between;align-items:center;font-size:0.75rem;color:var(--text);padding-top:0.6rem;border-top:1px solid var(--box-border)}.article-meta a{color:var(--green);text-decoration:none;font-weight:600}.article-meta a:hover{text-decoration:underline}.refresh-btn{display:block;margin:1.5rem auto 0;padding:0.5rem 1.3rem;background:var(--green);color:#000;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-family:var(--font-sans);font-size:0.95rem;transition:all 0.2s}.refresh-btn:hover{transform:translateY(-2px);box-shadow:0 0 15px rgba(46,204,113,0.4)}.refresh-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none}.error-box{background:rgba(255,0,0,0.1);border:1px solid rgba(255,0,0,0.3);border-radius:12px;padding:1.2rem;text-align:center;color:#ff6b6b;margin-bottom:1.5rem;font-size:0.9rem}.footer{text-align:center;padding:2rem;margin-top:2rem;border-top:1px solid var(--box-border);color:var(--text);font-size:0.85rem}.footer a{color:var(--green);text-decoration:none}.footer a:hover{text-decoration:underline}@keyframes spin{to{transform:rotate(360deg)}}@keyframes fadeIn{to{opacity:1;transform:translateY(0)}}::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:var(--body-bg)}::-webkit-scrollbar-thumb{background:var(--box-border);border-radius:10px}::-webkit-scrollbar-thumb:hover{background:var(--green)}@media(max-width:768px){.header{flex-direction:column;gap:0.75rem;padding:0.75rem 1rem}.container{padding:0 1rem}.news-grid{grid-template-columns:1fr}}</style></head><body><header class="header"><h1>AcreetionOS News</h1><nav><a href="https://acreetionos.org">Home</a><a href="https://acreetionos.org/developers.html">Developers</a></nav></header><div class="container"><div class="status-bar" id="status-bar"><span class="spinner"></span><span id="status-text">Fetching latest activity...</span></div><div id="error-container"></div><h2 style="font-family:var(--font-mono);color:var(--green);margin-bottom:0.5rem">Latest Updates</h2><p id="subtitle" style="color:var(--text);font-size:0.85rem;margin-bottom:1rem"></p><div class="news-grid" id="news-grid"></div><div id="want-more-section" style="text-align:center;margin-top:1rem"><button class="refresh-btn" id="want-more-btn" onclick="generateMoreArticles()">Want more about AcreetionOS?</button></div><button class="refresh-btn" id="refresh-btn" onclick="fetchNews()">Refresh</button></div><footer class="footer"><p>Part of the <a href="https://acreetionos.org">AcreetionOS</a> project ecosystem.</p><p style="color:var(--text-bright);font-size:0.8rem;margin-top:0.5rem">Powered by AI — tracking <a href="https://github.com/AcreetionOS-Code" style="color:var(--green)">GitHub</a> and <a href="https://gitlab.acreetionos.org" style="color:var(--green)">GitLab</a></p><p>&copy; 2026 AcreetionOS Project</p></footer><script>const NEWS_API='https://aiden.acreetionos.org/api/news';const CHAT_API='https://aiden.acreetionos.org/api/chat';const statusEl=document.getElementById('status-bar');const statusText=document.getElementById('status-text');const gridEl=document.getElementById('news-grid');const errorEl=document.getElementById('error-container');const subtitleEl=document.getElementById('subtitle');const moreBtn=document.getElementById('want-more-btn');const moreSection=document.getElementById('want-more-section');let cachedActivity=[];function setStatus(msg,loading=true){statusText.textContent=msg;if(loading){statusEl.innerHTML='<span class="spinner"></span><span id="status-text">'+msg+'</span>'}else{statusEl.innerHTML='<span class="dot">&#10003;</span> <span id="status-text">'+msg+'</span>'}}function showError(msg){errorEl.innerHTML='<div class="error-box">'+msg+'</div>'}function clearError(){errorEl.innerHTML=''}function addArticle(a){const card=document.createElement('div');card.className='article';card.innerHTML='<div class="article-body"><span class="tag '+a.tagClass+'">'+a.tag+'</span><h3>'+a.title+'</h3><p>'+(a.desc||'')+'</p><div class="article-meta"><span>'+a.source+'</span><a href="'+a.url+'" target="_blank" rel="noopener">Read More</a></div></div>';gridEl.appendChild(card)}function addMultipleArticles(articles){articles.forEach(a=>addArticle(a));subtitleEl.textContent=gridEl.querySelectorAll('.article').length+' articles'}async function generateMoreArticles(){moreBtn.disabled=true;moreBtn.textContent='Generating...';setStatus('AI is generating more articles about AcreetionOS...');try{const sample=cachedActivity.slice(0,8).map(a=>{if(a.type==='release')return'[RELEASE] '+a.repo+' - '+a.message;return'['+a.source+'] '+a.repo+' - '+a.message}).join('\n');const res=await fetch(CHAT_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'system',content:'You write news about the AcreetionOS Linux project. Write 3 concise news articles as a JSON array. Each article: {title(max 50 chars), summary(1 short sentence), tag(Release/Development/Community/Infrastructure), url(use the most relevant real URL)}. Respond with ONLY a valid JSON array. No markdown.'},{role:'user',content:'Generate AcreetionOS articles from this activity:\n'+sample}],max_tokens:512})});if(res.ok){const data=await res.json();let content=(data.choices?.[0]?.message?.content||'').replace(/```json\s*/gi,'').replace(/```\s*$/g,'').trim();const parsed=JSON.parse(content);if(Array.isArray(parsed)){const articles=parsed.map(a=>({title:a.title||'Untitled',desc:a.summary||a.desc||'',tag:a.tag||'Development',tagClass:'tag-'+(a.tag||'dev').toLowerCase().includes('release')?'release':(a.tag||'dev').toLowerCase().includes('community')?'community':(a.tag||'dev').toLowerCase().includes('infra')?'infra':'commit',url:a.url||'https://acreetionos.org',source:'AI',date:''}));addMultipleArticles(articles);setStatus('Added '+articles.length+' AI-generated articles',false)}}moreSection.innerHTML='<p style="color:var(--text);font-size:0.85rem;text-align:center">AI articles generated. <a href="#" onclick="fetchNews();return false" style="color:var(--green)">Refresh for latest</a></p>'}catch(e){console.error('AI error:',e);setStatus('AI generation failed',false);showError('AI generation failed. Try again.')}}async function fetchNews(){clearError();const btn=document.getElementById('refresh-btn');btn.disabled=true;gridEl.innerHTML='';moreSection.innerHTML='<button class="refresh-btn" id="want-more-btn" onclick="generateMoreArticles()">Want more about AcreetionOS?</button>';document.getElementById('want-more-btn').disabled=false;cachedActivity=[];setStatus('Fetching latest activity...');try{const newsRes=await fetch(NEWS_API);if(!newsRes.ok)throw new Error('Failed to fetch news');const data=await newsRes.json();cachedActivity=data.activity||[];const articles=data.articles||[];if(articles.length>0){addMultipleArticles(articles)}if(cachedActivity.length>0){setStatus('Loaded. Click "Want more" for AI articles.',false)}else{setStatus('No recent articles found',false)}}catch(e){console.error('Error:',e);setStatus('Failed to load news',false);showError('Could not load news: '+(e.message||'unknown error'))}finally{btn.disabled=false}}fetchNews();</script></body></html>
