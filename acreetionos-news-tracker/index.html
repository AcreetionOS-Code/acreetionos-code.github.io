<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="AcreetionOS news tracked from GitHub, GitLab, Google News, and AI."><meta name="theme-color" content="#2ecc71"><title>AcreetionOS News</title><link rel="icon" href="https://acreetionos.org/acreetionoslogo.webp"><link href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{--green:#2ecc71;--bg:#121212;--panel:#1a1a1a;--box:#222;--border:#333;--bright:#e5e5e5;--muted:#b2b2b2;--purple:#9b59b6;--blue:#61afef;--orange:#f39c12;--sans:'Roboto',sans-serif;--mono:'Fira Code',monospace}*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--sans);background:var(--bg);color:var(--bright);line-height:1.6;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,0.03) 1px,transparent 0);background-size:40px 40px}.header{background:rgba(24,26,27,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:2px solid var(--green);border-radius:0 0 16px 16px;position:sticky;top:0;z-index:100;padding:0.75rem 2rem;display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto}.header h1{font-family:var(--mono);font-size:1.4rem;color:var(--green)}.header a{color:var(--muted);text-decoration:none;font-weight:500;margin-left:1.5rem;transition:color 0.2s}.header a:hover{color:var(--bright)}.container{max-width:1200px;margin:1.5rem auto;padding:0 2rem}.st{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:0.6rem 1rem;margin-bottom:1.5rem;text-align:center;color:var(--muted);font-size:0.85rem;transition:all 0.3s}.st .sp{display:inline-block;width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin 0.8s linear infinite;margin-right:0.4rem;vertical-align:middle}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:1rem;margin-top:0.5rem}.c{background:var(--box);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:all 0.3s ease;opacity:0;transform:translateY(24px)}.c.show{opacity:1;transform:translateY(0)}.c:hover{transform:translateY(-3px);box-shadow:0 8px 32px rgba(46,204,113,0.15);border-color:var(--green)}.b{padding:1rem}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.5rem}.tg{display:inline-block;padding:0.2rem 0.6rem;border-radius:10px;font-size:0.65rem;font-weight:700;letter-spacing:0.3px;text-transform:uppercase}.rls{background:rgba(46,204,113,0.2);color:var(--green)}.cmt{background:rgba(97,175,239,0.2);color:var(--blue)}.com{background:rgba(155,89,182,0.2);color:var(--purple)}.inf{background:rgba(243,156,18,0.2);color:var(--orange)}.dt{font-size:0.65rem;color:var(--muted);font-family:var(--mono)}.c h3{font-size:1rem;margin-bottom:0.3rem;color:var(--bright);line-height:1.3}.c p{color:var(--muted);font-size:0.8rem;margin-bottom:0.5rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.meta{display:flex;justify-content:space-between;align-items:center;font-size:0.7rem;color:var(--muted);padding-top:0.5rem;border-top:1px solid var(--border)}.meta .src{display:flex;align-items:center;gap:0.3rem}.meta .src .dot{width:6px;height:6px;border-radius:50%;display:inline-block}.dot-gh{background:var(--green)}.dot-gl{background:var(--orange)}.dot-news{background:var(--purple)}.dot-ai{background:var(--blue)}.meta a{color:var(--green);text-decoration:none;font-weight:600;font-size:0.7rem}.meta a:hover{text-decoration:underline}.mb{display:block;margin:1rem auto 0;padding:0.45rem 1.2rem;background:var(--green);color:#000;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-family:var(--sans);font-size:0.9rem;transition:all 0.2s}.mb:hover{transform:translateY(-2px);box-shadow:0 0 15px rgba(46,204,113,0.4)}.mb:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none}.er{background:rgba(255,0,0,0.1);border:1px solid rgba(255,0,0,0.3);border-radius:12px;padding:0.8rem 1rem;text-align:center;color:#ff6b6b;margin-bottom:1rem;font-size:0.85rem}.stats{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-bottom:1rem;font-size:0.75rem;color:var(--muted)}.stats span{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:0.3rem 0.7rem}.stats b{color:var(--green)}.ft{text-align:center;padding:1.5rem;margin-top:1.5rem;border-top:1px solid var(--border);color:var(--muted);font-size:0.8rem}.ft a{color:var(--green);text-decoration:none}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:768px){.header{flex-direction:column;gap:0.5rem;padding:0.5rem 1rem}.container{padding:0 1rem}.g{grid-template-columns:1fr}}</style></head><body><header class="header"><h1>AcreetionOS News</h1><nav><a href="https://acreetionos.org">Home</a><a href="https://acreetionos.org/developers.html">Devs</a><a href="https://github.com/AcreetionOS-Code">GitHub</a></nav></header><div class="container"><div class="st" id="st"><span id="stxt">Initializing...</span></div><div id="er"></div><h2 style="font-family:var(--mono);color:var(--green);margin-bottom:0.3rem;font-size:1.2rem">Latest Updates</h2><div class="stats" id="stats"></div><div class="g" id="g"></div><div id="ms" style="text-align:center;margin-top:0.75rem"></div></div><footer class="ft"><p>Part of the <a href="https://acreetionos.org">AcreetionOS</a> project — tracking <a href="https://github.com/AcreetionOS-Code">GitHub</a>, Google News, and AI</p></footer><script>const G=document.getElementById('g'),ST=document.getElementById('st'),SX=document.getElementById('stxt'),ER=document.getElementById('er'),SUB=document.getElementById('stats'),MS=document.getElementById('ms');let allArticles=[];const CACHE_KEY='aosn3',TTL=600000;const OR_KEY=['REDACTED','REDACTED','REDACTED','REDACTED','REDACTED'].join('');const CORS_PROXY='https://api.allorigins.win/raw?url=';function st(t,l){SX.textContent=t;if(l){ST.style.borderColor='var(--border)';ST.innerHTML='<span class="sp"></span><span id="stxt">'+t+'</span>'}else{ST.style.borderColor='var(--green)';ST.innerHTML='<span id="stxt">'+t+'</span>'}}function err(m){ER.innerHTML='<div class="er">'+m+'</div>'}function fd(d){try{const date=new Date(d);if(isNaN(date.getTime()))return'';const now=new Date();const diff=now-date;if(diff<3600000)return Math.floor(diff/60000)+'m ago';if(diff<86400000)return Math.floor(diff/3600000)+'h ago';if(diff<604800000)return Math.floor(diff/86400000)+'d ago';return date.toLocaleDateString('en-US',{month:'short',day:'numeric'})}catch(){return''}}function ac(a){const c=document.createElement('div');c.className='c';const dotClass=a.src==='GitHub'?'dot-gh':a.src==='Google News'?'dot-news':a.src==='AI'?'dot-ai':'dot-gl';c.innerHTML='<div class="b"><div class="top"><span class="tg '+a.tc+'">'+a.tag+'</span><span class="dt">'+fd(a.date)+'</span></div><h3>'+a.title+'</h3><p>'+(a.desc||'')+'</p><div class="meta"><span class="src"><span class="dot '+dotClass+'"></span>'+a.src+'</span><a href="'+a.url+'" target="_blank" rel="noopener">Read More</a></div></div>';G.appendChild(c);requestAnimationFrame(()=>c.classList.add('show'))}function renderAll(){G.innerHTML='';allArticles.forEach(a=>ac(a));SUB.innerHTML='<span><b>'+allArticles.length+'</b> articles</span><span><b>'+allArticles.filter(x=>x.src==='GitHub').length+'</b> GitHub</span><span><b>'+allArticles.filter(x=>x.src==='Google News').length+'</b> News</span><span><b>'+allArticles.filter(x=>x.src==='AI').length+'</b> AI</span>'}function saveCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify({data:allArticles,ts:Date.now()}))}catch(e){}}function loadCache(){try{const raw=localStorage.getItem(CACHE_KEY);if(!raw)return false;const p=JSON.parse(raw);if(Date.now()-p.ts<TTL&&p.data.length>0){allArticles=p.data;return true}return false}catch(e){return false}}async function fetchGitHub(){const results=[];try{const rr=await fetch('https://api.github.com/orgs/AcreetionOS-Code/repos?per_page=6&sort=pushed');if(!rr.ok)return results;const repos=await rr.json();const fs=repos.slice(0,5).map(r=>Promise.all([fetch('https://api.github.com/repos/AcreetionOS-Code/'+r.name+'/commits?per_page=3'),r.name!=='acreetionos-code.github.io'?fetch('https://api.github.com/repos/AcreetionOS-Code/'+r.name+'/releases?per_page=2'):Promise.resolve(new Response('[]'))]).then(async([cr,rr])=>{const items=[];if(cr.ok){const cs=await cr.json();cs.forEach(c=>items.push({t:'commit',repo:r.name,msg:(c.commit.message||'').split('\n')[0],author:c.commit.author?.name||'Unknown',date:c.commit.author?.date,url:c.html_url,sha:c.sha?.slice(0,7)}))}if(rr.ok){try{const rs=await rr.json();Array.isArray(rs)&&rs.forEach(r=>items.push({t:'release',repo:r.name,msg:r.tag_name,desc:(r.body||'').split('\n')[0],author:r.author?.login||'',date:r.published_at||r.created_at,url:r.html_url}))}catch(e){}}return items}).catch(()=>[]));const nested=await Promise.all(fs);nested.flat().forEach(x=>{if(x.t==='release')allArticles.push({title:x.msg+' released on '+x.repo,desc:x.desc||'New release for the '+x.repo+' repository.',tag:'Release',tc:'rls',url:x.url,src:'GitHub',date:x.date});else allArticles.push({title:x.msg.slice(0,65),desc:'Commit by '+x.author+' on '+x.repo+(x.sha?' ('+x.sha+')':''),tag:'Development',tc:'cmt',url:x.url,src:'GitHub',date:x.date})})}catch(e){}}async function fetchRSS(){try{const feeds=['https://news.google.com/rss/search?q=%22AcreetionOS%22&hl=en-US&gl=US&ceid=US:en','https://news.google.com/rss/search?q=AcreetionOS+Linux&hl=en-US&gl=US&ceid=US:en'];for(const feed of feeds){try{const res=await fetch(CORS_PROXY+encodeURIComponent(feed));if(!res.ok)continue;const txt=await res.text();const items=txt.match(/<item>[\s\S]*?<\/item>/gi)||[];items.slice(0,5).forEach(item=>{const title=(item.match(/<title(?:<!\[CDATA\[)?([^\]]*)(?:\]\]>)?<\/title>/i)||[,''])[1].trim();const link=(item.match(/<link[^>]*>([^<]*)<\/link>/)||[,''])[1].trim();const desc=(item.match(/<description>(?:<!\[CDATA\[)?([^\]]*)(?:\]\]>)?<\/description>/i)||[,''])[1].replace(/<[^>]+>/g,'').slice(0,250);const date=(item.match(/<pubDate>([^<]*)<\/pubDate>/i)||[,''])[1];if(title&&link){allArticles.push({title:title.slice(0,70),desc:desc||'AcreetionOS mentioned in news.',tag:'Community',tc:'com',url:link,src:'Google News',date:date})}})}catch(e){}}}catch(e){}}async function generateAI(count){if(allArticles.length===0)return;const sample=allArticles.slice(0,8).map(x=>'['+x.src+'] '+(x.title||'')).join('\n');try{const res=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+OR_KEY,'HTTP-Referer':'https://acreetionos.org','X-Title':'AcreetionOS News'},body:JSON.stringify({model:'inclusionai/ring-2.6-1t:free',messages:[{role:'system',content:'You are a JSON generator. Output exactly '+count+' items. Each: {title,max 55 chars,summary,1-2 sentences,tag,one of Release/Development/Community/Infrastructure,url}. Valid JSON array. No markdown. No trailing commas.'},{role:'user',content:'Generate articles from:\n'+sample}],max_tokens:512})});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();let raw=(data.choices?.[0]?.message?.content||'').trim();raw=raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```\s*$/,'').replace(/,\s*([}\]])/g,'$1').replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"');raw=raw.replace(/\\'/g,"'");let arts;try{arts=JSON.parse(raw)}catch(e){const m=raw.match(/\[[\s\S]*\]/);if(m)try{arts=JSON.parse(m[0].replace(/,\s*([}\]])/g,'$1'))}catch(e2){throw new Error('AI returned invalid JSON')}}if(Array.isArray(arts)){arts.forEach((a,i)=>{if(!a||!a.title)return;allArticles.push({title:a.title||'AI Article '+(i+1),desc:a.summary||a.desc||'',tag:a.tag||'Development',tc:a.tag&&a.tag.toLowerCase().includes('release')?'rls':a.tag&&a.tag.toLowerCase().includes('community')?'com':a.tag&&a.tag.toLowerCase().includes('infra')?'inf':'cmt',url:a.url||'https://acreetionos.org',src:'AI',date:new Date().toISOString()})});saveCache();renderAll()}else throw new Error('Not an array')}catch(e){err('AI: '+(e.message||'Failed'))}}async function init(){const cached=loadCache();if(cached&&allArticles.length>3){st('Loaded '+allArticles.length+' articles from cache. Refreshing...',false);renderAll()}else{st('Fetching from GitHub and Google News...',true)}await Promise.all([fetchGitHub(),fetchRSS()]);allArticles.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));saveCache();renderAll();st('Tracking GitHub and Google News — '+allArticles.length+' articles',false);if(allArticles.length>0){MS.innerHTML='<button class="mb" id="mb">Want more about AcreetionOS? (AI)</button>';document.getElementById('mb').onclick=async function(){const btn=document.getElementById('mb');btn.disabled=true;btn.textContent='AI generating...';st('AI generating articles...',true);await generateAI(5);btn.textContent='Want more about AcreetionOS?';btn.disabled=false;st('Updated — '+allArticles.length+' articles',false)}}}init();</script></body></html>
