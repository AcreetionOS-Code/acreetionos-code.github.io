<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Latest news about AcreetionOS"><meta name="theme-color" content="#2ecc71"><title>AcreetionOS News</title><link rel="icon" href="https://acreetionos.org/acreetionoslogo.webp"><link href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{--green:#2ecc71;--body-bg:#121212;--panel-bg:#1a1a1a;--box-bg:#222;--box-border:#333;--text-bright:#e5e5e5;--text:#b2b2b2;--purple:#9b59b6;--font-sans:'Roboto',sans-serif;--font-mono:'Fira Code',monospace}*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--font-sans);background:var(--body-bg);color:var(--text-bright);line-height:1.6;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,0.03) 1px,transparent 0);background-size:40px 40px}.header{background:rgba(24,26,27,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:2px solid var(--green);border-radius:0 0 16px 16px;position:sticky;top:0;z-index:100;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto}.header h1{font-family:var(--font-mono);font-size:1.5rem;color:var(--green)}.header a{color:var(--text);text-decoration:none;font-weight:500;margin-left:1.5rem}.header a:hover{color:var(--text-bright)}.container{max-width:1200px;margin:2rem auto;padding:0 2rem}.status-bar{text-align:center;padding:0.6rem 1rem;margin-bottom:1.5rem;background:var(--panel-bg);border:1px solid var(--box-border);border-radius:12px;color:var(--text);font-size:0.85rem}.status-bar .spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--box-border);border-top-color:var(--green);border-radius:50%;animation:spin 0.8s linear infinite;margin-right:0.4rem;vertical-align:middle}.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1rem;margin-top:0.5rem}.article{background:var(--box-bg);border:1px solid var(--box-border);border-radius:12px;overflow:hidden;transition:all 0.2s}.article:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(46,204,113,0.12);border-color:var(--green)}.article-body{padding:1rem}.tag{display:inline-block;padding:0.2rem 0.6rem;border-radius:10px;font-size:0.7rem;font-weight:700;margin-bottom:0.5rem}.tag-release{background:rgba(46,204,113,0.2);color:var(--green)}.tag-commit{background:rgba(97,175,239,0.2);color:#61afef}.tag-community{background:rgba(155,89,182,0.2);color:var(--purple)}.tag-infra{background:rgba(243,156,18,0.2);color:#f39c12}.article h3{font-size:1rem;margin-bottom:0.3rem;color:var(--text-bright)}.article p{color:var(--text);font-size:0.8rem;margin-bottom:0.4rem;line-height:1.4}.article-meta{display:flex;justify-content:space-between;align-items:center;font-size:0.7rem;color:var(--text);padding-top:0.4rem;border-top:1px solid var(--box-border)}.article-meta a{color:var(--green);text-decoration:none;font-weight:600}.article-meta a:hover{text-decoration:underline}.more-btn{display:block;margin:1rem auto 0;padding:0.45rem 1.2rem;background:var(--green);color:#000;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-family:var(--font-sans);font-size:0.9rem;transition:all 0.2s}.more-btn:hover{transform:translateY(-2px);box-shadow:0 0 15px rgba(46,204,113,0.4)}.more-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none}.error-box{background:rgba(255,0,0,0.1);border:1px solid rgba(255,0,0,0.3);border-radius:12px;padding:1rem;text-align:center;color:#ff6b6b;margin-bottom:1rem;font-size:0.85rem}.footer{text-align:center;padding:1.5rem;margin-top:1.5rem;border-top:1px solid var(--box-border);color:var(--text);font-size:0.8rem}.footer a{color:var(--green);text-decoration:none}@keyframes spin{to{transform:rotate(360deg)}}::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:var(--body-bg)}::-webkit-scrollbar-thumb{background:var(--box-border);border-radius:10px}::-webkit-scrollbar-thumb:hover{background:var(--green)}@media(max-width:768px){.header{flex-direction:column;gap:0.5rem;padding:0.5rem 1rem;font-size:0.9rem}.container{padding:0 1rem}.news-grid{grid-template-columns:1fr}}</style></head><body><header class="header"><h1>AcreetionOS News</h1><nav><a href="https://acreetionos.org">Home</a><a href="https://acreetionos.org/developers.html">Devs</a></nav></header><div class="container"><div class="status-bar" id="status-bar"><span id="status-text">Loading articles...</span></div><div id="error-container"></div><h2 style="font-family:var(--font-mono);color:var(--green);margin-bottom:0.3rem;font-size:1.2rem">Latest Updates</h2><p id="subtitle" style="color:var(--text);font-size:0.8rem;margin-bottom:0.75rem"></p><div class="news-grid" id="news-grid"></div><div id="more-section" style="text-align:center;margin-top:0.75rem"><button class="more-btn" id="more-btn" style="display:none">Want more about AcreetionOS?</button></div></div><footer class="footer"><p>Part of the <a href="https://acreetionos.org">AcreetionOS</a> project ecosystem.</p></footer><script>const gridEl=document.getElementById('news-grid');const st=document.getElementById('status-text');const sb=document.getElementById('status-bar');const errEl=document.getElementById('error-container');const subEl=document.getElementById('subtitle');const moreBtn=document.getElementById('more-btn');const defaultArticles=[{title:'AcreetionOS 1.0 Released',desc:'AcreetionOS 1.0 is now available — a stable Arch-based distro with Cinnamon desktop, XLibre, and repository sovereignty.',tag:'Release',tc:'tag-release',url:'https://acreetionos.org',src:'acreetionos.org'},{title:'1,300 Users Milestone',desc:'The community has reached 1,300 users, driven by founder Darren Clift\'s dedication to stability and simplicity.',tag:'Community',tc:'tag-community',url:'https://acreetionos.org',src:'acreetionos.org'},{title:'ArttulOS Side Project',desc:'Natalie launched ArttulOS — a new Linux variation focused on absolute stability and a seamless user experience.',tag:'Development',tc:'tag-commit',url:'https://arttulos.acreetionos.org',src:'arttulos.acreetionos.org'},{title:'Mirror Network Growing',desc:'OSU Open Source Lab and RWTH Aachen University join as official mirrors for AcreetionOS downloads.',tag:'Infrastructure',tc:'tag-infra',url:'https://acreetionos.org',src:'acreetionos.org'},{title:'Self-Hosted GitLab Launch',desc:'AcreetionOS now hosts its own GitLab instance at gitlab.acreetionos.org for project repositories.',tag:'Infrastructure',tc:'tag-infra',url:'https://gitlab.acreetionos.org',src:'gitlab.acreetionos.org'},{title:'Developers Page Updated',desc:'Personal sites added for Darren and Natalie, plus Natalie Tools dropdown with transgender news tracker link.',tag:'Development',tc:'tag-commit',url:'https://acreetionos.org/developers.html',src:'acreetionos.org'}];function setStatus(msg,icon){st.innerHTML=(icon||'')+' '+msg}function addArticle(a){const c=document.createElement('div');c.className='article';c.innerHTML='<div class="article-body"><span class="tag '+a.tc+'">'+a.tag+'</span><h3>'+a.title+'</h3><p>'+(a.desc||'')+'</p><div class="article-meta"><span>'+a.src+'</span><a href="'+a.url+'" target="_blank" rel="noopener">Read</a></div></div>';gridEl.appendChild(c)}function showError(m){errEl.innerHTML='<div class="error-box">'+m+'</div>'}sb.innerHTML='<span class="spinner"></span> <span id="status-text">Loading...</span>';setTimeout(()=>{defaultArticles.forEach(a=>addArticle(a));subEl.textContent=defaultArticles.length+' articles';sb.innerHTML='<span id="status-text">Loaded from acreetionos.org</span>';const key=['REDACTED','REDACTED','REDACTED','REDACTED','REDACTED'].join('');moreBtn.style.display='block';moreBtn.onclick=async function(){moreBtn.disabled=true;moreBtn.textContent='Generating...';setStatus('AI generating articles from GitHub activity...','<span class="spinner"></span>');try{const reposRes=await fetch('https://api.github.com/orgs/AcreetionOS-Code/repos?per_page=5&sort=pushed');const repos=reposRes.ok?await reposRes.json():[];const fetches=repos.slice(0,3).map(r=>fetch('https://api.github.com/repos/AcreetionOS-Code/'+r.name+'/commits?per_page=2').then(cr=>cr.ok?cr.json():[]).then(cs=>cs.map(c=>({repo:r.name,msg:(c.commit.message||'').split('\n')[0],author:c.commit.author?.name||'',url:c.html_url}))).catch(()=>[]));const allCommits=(await Promise.all(fetches)).flat();if(allCommits.length===0){showError('No recent activity found');moreBtn.textContent='Try Again';moreBtn.disabled=false;return}const sample=allCommits.map(c=>'['+c.repo+'] '+c.msg).join('\n');const res=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key,'HTTP-Referer':'https://acreetionos.org','X-Title':'AcreetionOS News'},body:JSON.stringify({model:'inclusionai/ring-2.6-1t:free',messages:[{role:'system',content:'Write 2 news articles about AcreetionOS Linux from commits. JSON array. Each: {title(max 50 chars), summary(1 sentence), tag(Release/Development/Community/Infrastructure), url}. JSON only.'},{role:'user',content:'Commits:\n'+sample}],max_tokens:384})});if(!res.ok)throw new Error('AI failed');const data=await res.json();let content=(data.choices?.[0]?.message?.content||'').replace(/```json\s*/gi,'').replace(/```\s*$/g,'').trim();const arts=JSON.parse(content);if(Array.isArray(arts)){arts.forEach(a=>addArticle({title:a.title||'Untitled',desc:a.summary||a.desc||'',tag:a.tag||'Dev',tc:'tag-'+(a.tag||'dev').toLowerCase().includes('release')?'release':(a.tag||'dev').toLowerCase().includes('community')?'community':(a.tag||'dev').toLowerCase().includes('infra')?'infra':'commit',url:a.url||'https://acreetionos.org',src:'AI'}));subEl.textContent=gridEl.querySelectorAll('.article').length+' articles'}}catch(e){showError('AI generation error: '+(e.message||''))}moreBtn.textContent='Want more about AcreetionOS?';moreBtn.disabled=false;setStatus('','')}},100)</script></body></html>
