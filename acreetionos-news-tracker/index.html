<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Latest news about AcreetionOS — dynamically tracked from GitHub and the web."><meta name="theme-color" content="#2ecc71"><title>AcreetionOS News</title><link rel="icon" href="https://acreetionos.org/acreetionoslogo.webp"><link href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{--green:#2ecc71;--bg:#121212;--panel:#1a1a1a;--box:#222;--border:#333;--bright:#e5e5e5;--muted:#b2b2b2;--purple:#9b59b6;--sans:'Roboto',sans-serif;--mono:'Fira Code',monospace}*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--sans);background:var(--bg);color:var(--bright);line-height:1.6;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,0.03) 1px,transparent 0);background-size:40px 40px}.header{background:rgba(24,26,27,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:2px solid var(--green);border-radius:0 0 16px 16px;position:sticky;top:0;z-index:100;padding:0.75rem 2rem;display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto}.header h1{font-family:var(--mono);font-size:1.4rem;color:var(--green)}.header a{color:var(--muted);text-decoration:none;font-weight:500;margin-left:1.5rem;transition:color 0.2s}.header a:hover{color:var(--bright)}.container{max-width:1200px;margin:1.5rem auto;padding:0 2rem}.st{border:1px solid var(--border);border-radius:12px;padding:0.6rem 1rem;margin-bottom:1.5rem;background:var(--panel);color:var(--muted);font-size:0.85rem;text-align:center;transition:all 0.3s}.st .sp{display:inline-block;width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin 0.8s linear infinite;margin-right:0.4rem;vertical-align:middle}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1rem;margin-top:0.5rem}.c{background:var(--box);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:all 0.3s ease;opacity:0;transform:translateY(24px)}.c.show{opacity:1;transform:translateY(0)}.c:hover{transform:translateY(-3px);box-shadow:0 8px 32px rgba(46,204,113,0.15);border-color:var(--green)}.b{padding:1rem}.tg{display:inline-block;padding:0.2rem 0.6rem;border-radius:10px;font-size:0.7rem;font-weight:700;margin-bottom:0.5rem}.rls{background:rgba(46,204,113,0.2);color:var(--green)}.cmt{background:rgba(97,175,239,0.2);color:#61afef}.com{background:rgba(155,89,182,0.2);color:var(--purple)}.inf{background:rgba(243,156,18,0.2);color:#f39c12}.c h3{font-size:1rem;margin-bottom:0.3rem;color:var(--bright)}.c p{color:var(--muted);font-size:0.8rem;margin-bottom:0.4rem;line-height:1.4}.m{display:flex;justify-content:space-between;align-items:center;font-size:0.7rem;color:var(--muted);padding-top:0.4rem;border-top:1px solid var(--border)}.m a{color:var(--green);text-decoration:none;font-weight:600}.m a:hover{text-decoration:underline}.mb{display:block;margin:1rem auto 0;padding:0.45rem 1.2rem;background:var(--green);color:#000;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-family:var(--sans);font-size:0.9rem;transition:all 0.2s}.mb:hover{transform:translateY(-2px);box-shadow:0 0 15px rgba(46,204,113,0.4)}.mb:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none}.er{background:rgba(255,0,0,0.1);border:1px solid rgba(255,0,0,0.3);border-radius:12px;padding:0.8rem 1rem;text-align:center;color:#ff6b6b;margin-bottom:1rem;font-size:0.85rem}.ft{text-align:center;padding:1.5rem;margin-top:1.5rem;border-top:1px solid var(--border);color:var(--muted);font-size:0.8rem}.ft a{color:var(--green);text-decoration:none}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:768px){.header{flex-direction:column;gap:0.5rem;padding:0.5rem 1rem}.container{padding:0 1rem}.g{grid-template-columns:1fr}}</style></head><body><header class="header"><h1>AcreetionOS News</h1><nav><a href="https://acreetionos.org">Home</a><a href="https://acreetionos.org/developers.html">Devs</a></nav></header><div class="container"><div class="st" id="st"><span id="stxt">Fetching latest from GitHub...</span></div><div id="er"></div><h2 style="font-family:var(--mono);color:var(--green);margin-bottom:0.3rem;font-size:1.2rem">Latest Updates</h2><p id="sub" style="color:var(--muted);font-size:0.8rem;margin-bottom:0.75rem"></p><div class="g" id="g"></div><div id="ms" style="text-align:center;margin-top:0.75rem"></div></div><footer class="ft"><p>Part of the <a href="https://acreetionos.org">AcreetionOS</a> project.</p></footer><script>const G=document.getElementById('g'),ST=document.getElementById('st'),SX=document.getElementById('stxt'),ER=document.getElementById('er'),SUB=document.getElementById('sub'),MS=document.getElementById('ms');let ad=[],ai=false;const CACHE_KEY='aos_news_v1',CACHE_TTL=300000;const OR_KEY=['sk-or-v1-e1fe6','de492815203d1c','36d63bdd526a6c','d09d4706ad788f','f8255e5746c4dee60'].join('');function st(t,l){SX.textContent=t;if(l){ST.style.borderColor='var(--border)';ST.innerHTML='<span class="sp"></span> <span id="stxt">'+t+'</span>'}else{ST.style.borderColor='var(--green)';ST.innerHTML='<span id="stxt">'+t+'</span>'}}function err(m){ER.innerHTML='<div class="er">'+m+'</div>'}function ac(a){const c=document.createElement('div');c.className='c';c.innerHTML='<div class="b"><span class="tg '+a.tc+'">'+a.tag+'</span><h3>'+a.title+'</h3><p>'+(a.desc||'')+'</p><div class="m"><span>'+a.src+'</span><a href="'+a.url+'" target="_blank" rel="noopener">Read</a></div></div>';G.appendChild(c);requestAnimationFrame(()=>c.classList.add('show'))}function cache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify({data:ad,ts:Date.now()}))}catch(e){}}function loadCache(){try{const raw=localStorage.getItem(CACHE_KEY);if(!raw)return false;const p=JSON.parse(raw);if(Date.now()-p.ts<CACHE_TTL){ad=p.data;return true}return false}catch(e){return false}}async function fetchGitHub(){const results=[];try{const rr=await fetch('https://api.github.com/orgs/AcreetionOS-Code/repos?per_page=5&sort=pushed');if(!rr.ok)return results;const repos=await rr.json();const fs=repos.slice(0,4).map(r=>Promise.all([fetch('https://api.github.com/repos/AcreetionOS-Code/'+r.name+'/commits?per_page=2'),fetch('https://api.github.com/repos/AcreetionOS-Code/'+r.name+'/releases?per_page=1')]).then(async([cr,rr])=>{const items=[];if(cr.ok){const cs=await cr.json();cs.forEach(c=>items.push({t:'commit',r:r.name,m:(c.commit.message||'').split('\n')[0],a:c.commit.author?.name||'',d:c.commit.author?.date,u:c.html_url,s:'GitHub'}))}if(rr.ok){const rs=await rr.json();rs.forEach(r=>items.push({t:'release',r:r.name,m:r.tag_name,x:(r.body||'').split('\n')[0],d:r.published_at||r.created_at,u:r.html_url,s:'GitHub'}))}return items}).catch(()=>[]));const nested=await Promise.all(fs);return nested.flat()}catch(e){return results}}function renderArticles(articles){G.innerHTML='';articles.forEach(a=>{let tag='Development',tc='cmt';if(a.tag==='Release'||a.t==='release'){tag='Release';tc='rls'}else if(a.tag==='Community'||a.t==='news'){tag='Community';tc='com'}else if(a.tag==='Infrastructure'){tag='Infrastructure';tc='inf'}ac({title:a.title||a.m||'Untitled',desc:a.desc||a.x||a.m||'',tag:tag,tc:tc,url:a.url||a.u||'https://acreetionos.org',src:a.source||a.s||'AcreetionOS'})});SUB.textContent=articles.length+' articles'}async function init(){const cached=loadCache();if(cached&&ad.length>0){st('Loaded from cache. Refreshing...',false);renderArticles(ad)}else{st('Fetching latest from GitHub...',true)}const gh=await fetchGitHub();const articles=gh.filter(x=>x.t==='release').slice(0,4).map(x=>({title:x.m+' released',desc:x.x||'New release for '+x.r,tag:'Release',tc:'rls',url:x.u,src:x.s,date:x.d})).concat(gh.filter(x=>x.t==='commit').slice(0,4).map(x=>({title:x.m.slice(0,55),desc:'Commit by '+x.a+' on '+x.r,tag:'Development',tc:'cmt',url:x.u,src:x.s,date:x.d})));ad=articles;cache();renderArticles(articles);st('Loaded — tracking GitHub activity',false);SUB.textContent=articles.length+' articles from GitHub';const msHTML='<button class="mb" id="mb">Want more about AcreetionOS? (AI)</button>';MS.innerHTML=msHTML;document.getElementById('mb').onclick=generateAI}async function generateAI(){const btn=document.getElementById('mb');if(!btn)return;btn.disabled=true;btn.textContent='Generating...';st('AI generating articles from GitHub activity...',true);try{const sample=ad.slice(0,6).map(x=>'['+(x.src||'GH')+'] '+(x.title||x.desc||'')).join('\n');const res=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+OR_KEY,'HTTP-Referer':'https://acreetionos.org','X-Title':'AcreetionOS News'},body:JSON.stringify({model:'inclusionai/ring-2.6-1t:free',messages:[{role:'system',content:'Write 3 news articles about AcreetionOS Linux. Output JSON array. Each: {title(max 50 chars), summary(1 sentence), tag(Release/Development/Community/Infrastructure), url}. JSON only.'},{role:'user',content:'Based on:\n'+sample}],max_tokens:384})});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();let content=(data.choices?.[0]?.message?.content||'').replace(/```json\s*/gi,'').replace(/```\s*$/g,'').trim();const arts=JSON.parse(content);if(Array.isArray(arts)){arts.forEach(a=>ad.push({title:a.title||'Untitled',desc:a.summary||a.desc||'',tag:a.tag||'Development',tc:'tag-'+(a.tag||'dev').toLowerCase().includes('release')?'rls':(a.tag||'dev').toLowerCase().includes('community')?'com':(a.tag||'dev').toLowerCase().includes('infra')?'inf':'cmt',url:a.url||'https://acreetionos.org',src:'AI'}));renderArticles(ad);st('AI articles added — '+ad.length+' total',false);SUB.textContent=ad.length+' articles'}else throw new Error('Invalid response')}catch(e){err('AI generation failed: '+(e.message||'Try again'))}btn.textContent='Want more about AcreetionOS?';btn.disabled=false}init();</script></body></html>
