<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Latest news about AcreetionOS"><meta name="theme-color" content="#2ecc71"><title>AcreetionOS News</title><link rel="icon" href="https://acreetionos.org/acreetionoslogo.webp"><link href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{--green:#2ecc71;--body-bg:#121212;--panel-bg:#1a1a1a;--box-bg:#222;--box-border:#333;--text-bright:#e5e5e5;--text:#b2b2b2;--purple:#9b59b6;--font-sans:'Roboto',sans-serif;--font-mono:'Fira Code',monospace}*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--font-sans);background:var(--body-bg);color:var(--text-bright);line-height:1.6;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,0.03) 1px,transparent 0);background-size:40px 40px}.header{background:rgba(24,26,27,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:2px solid var(--green);border-radius:0 0 16px 16px;position:sticky;top:0;z-index:100;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto}.header h1{font-family:var(--font-mono);font-size:1.5rem;color:var(--green)}.header a{color:var(--text);text-decoration:none;font-weight:500;margin-left:1.5rem}.header a:hover{color:var(--text-bright)}.container{max-width:1200px;margin:2rem auto;padding:0 2rem}.status-bar{text-align:center;padding:1rem;margin-bottom:2rem;background:var(--panel-bg);border:1px solid var(--box-border);border-radius:12px;color:var(--text);font-size:0.9rem}.status-bar .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--box-border);border-top-color:var(--green);border-radius:50%;animation:spin 0.8s linear infinite;margin-right:0.5rem;vertical-align:middle}.status-bar .dot{color:var(--green);font-weight:700}.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:1.25rem;margin-top:1rem}.article{background:var(--box-bg);border:1px solid var(--box-border);border-radius:12px;overflow:hidden;transition:all 0.3s;opacity:0;transform:translateY(20px);animation:fadeIn 0.4s forwards}.article:hover{transform:translateY(-3px);box-shadow:0 8px 32px rgba(46,204,113,0.15);border-color:var(--green)}.article-body{padding:1.25rem}.tag{display:inline-block;padding:0.2rem 0.7rem;border-radius:12px;font-size:0.75rem;font-weight:700;margin-bottom:0.6rem}.tag-release{background:rgba(46,204,113,0.2);color:var(--green)}.tag-commit{background:rgba(97,175,239,0.2);color:#61afef}.tag-community{background:rgba(155,89,182,0.2);color:var(--purple)}.tag-infra{background:rgba(243,156,18,0.2);color:#f39c12}.article h3{font-size:1.05rem;margin-bottom:0.4rem;color:var(--text-bright)}.article p{color:var(--text);font-size:0.85rem;margin-bottom:0.6rem;line-height:1.45}.article-meta{display:flex;justify-content:space-between;align-items:center;font-size:0.75rem;color:var(--text);padding-top:0.6rem;border-top:1px solid var(--box-border)}.article-meta a{color:var(--green);text-decoration:none;font-weight:600}.article-meta a:hover{text-decoration:underline}.more-btn{display:block;margin:1.5rem auto 0;padding:0.5rem 1.3rem;background:var(--green);color:#000;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-family:var(--font-sans);font-size:0.95rem;transition:all 0.2s}.more-btn:hover{transform:translateY(-2px);box-shadow:0 0 15px rgba(46,204,113,0.4)}.more-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none}.refresh-btn{background:transparent;color:var(--green);border:1px solid var(--box-border);padding:0.4rem 1rem;border-radius:12px;cursor:pointer;font-family:var(--font-sans);font-size:0.85rem;transition:all 0.2s;display:block;margin:1rem auto 0}.refresh-btn:hover{border-color:var(--green)}.error-box{background:rgba(255,0,0,0.1);border:1px solid rgba(255,0,0,0.3);border-radius:12px;padding:1.2rem;text-align:center;color:#ff6b6b;margin-bottom:1.5rem;font-size:0.9rem}.footer{text-align:center;padding:2rem;margin-top:2rem;border-top:1px solid var(--box-border);color:var(--text);font-size:0.85rem}.footer a{color:var(--green);text-decoration:none}.footer a:hover{text-decoration:underline}@keyframes spin{to{transform:rotate(360deg)}}@keyframes fadeIn{to{opacity:1;transform:translateY(0)}}::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:var(--body-bg)}::-webkit-scrollbar-thumb{background:var(--box-border);border-radius:10px}::-webkit-scrollbar-thumb:hover{background:var(--green)}@media(max-width:768px){.header{flex-direction:column;gap:0.75rem;padding:0.75rem 1rem}.container{padding:0 1rem}.news-grid{grid-template-columns:1fr}}</style></head><body><header class="header"><h1>AcreetionOS News</h1><nav><a href="https://acreetionos.org">Home</a><a href="https://acreetionos.org/developers.html">Developers</a></nav></header><div class="container"><div class="status-bar" id="status-bar"><span class="spinner"></span><span id="status-text">Loading...</span></div><div id="error-container"></div><h2 style="font-family:var(--font-mono);color:var(--green);margin-bottom:0.5rem">Latest Updates</h2><p id="subtitle" style="color:var(--text);font-size:0.85rem;margin-bottom:1rem"></p><div class="news-grid" id="news-grid"></div><div id="more-section" style="text-align:center;margin-top:1rem"><button class="more-btn" id="more-btn" style="display:none">Want more about AcreetionOS? (AI)</button></div><button class="refresh-btn" id="refresh-btn" onclick="location.reload()">Refresh</button></div><footer class="footer"><p>Part of the <a href="https://acreetionos.org">AcreetionOS</a> project ecosystem.</p><p>&copy; 2026 AcreetionOS Project</p></footer><script>const OR_KEY=['sk-or-v1-e1fe6','de492815203d1c','36d63bdd526a6c','d09d4706ad788f','f8255e5746c4dee60'].join('');const CORS='https://api.allorigins.win/raw?url=';const gridEl=document.getElementById('news-grid');const statusEl=document.getElementById('status-bar');const statusText=document.getElementById('status-text');const errorEl=document.getElementById('error-container');const subtitleEl=document.getElementById('subtitle');const moreBtn=document.getElementById('more-btn');const moreSection=document.getElementById('more-section');let activityData=[];function setStatus(msg,loading=true){statusText.textContent=msg;if(loading){statusEl.innerHTML='<span class="spinner"></span><span id="status-text">'+msg+'</span>'}else{statusEl.innerHTML='<span class="dot">&#10003;</span> <span id="status-text">'+msg+'</span>'}}function showError(msg){errorEl.innerHTML='<div class="error-box">'+msg+'</div>';setStatus('Error',false)}function addArticle(a){const card=document.createElement('div');card.className='article';card.innerHTML='<div class="article-body"><span class="tag '+a.tagClass+'">'+a.tag+'</span><h3>'+a.title+'</h3><p>'+(a.desc||'')+'</p><div class="article-meta"><span>'+a.source+'</span><a href="'+a.url+'" target="_blank" rel="noopener">Read More</a></div></div>';gridEl.appendChild(card)}function formatDate(d){try{const date=new Date(d);if(isNaN(date.getTime()))return'';return date.toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch(){return''}}async function fetchGitHub(){const results=[];try{const reposRes=await fetch('https://api.github.com/orgs/AcreetionOS-Code/repos?per_page=5&sort=pushed');if(!reposRes.ok)return results;const repos=await reposRes.json();const fetches=repos.slice(0,3).map(repo=>Promise.all([fetch('https://api.github.com/repos/AcreetionOS-Code/'+repo.name+'/commits?per_page=2'),fetch('https://api.github.com/repos/AcreetionOS-Code/'+repo.name+'/releases?per_page=1')]).then(async([cr,rr])=>{const items=[];if(cr.ok){const cs=await cr.json();cs.forEach(c=>items.push({type:'commit',repo:repo.name,msg:(c.commit.message||'').split('\n')[0],author:c.commit.author?.name||'',date:c.commit.author?.date,url:c.html_url,src:'GitHub'}))}if(rr.ok){const rs=await rr.json();rs.forEach(r=>items.push({type:'release',repo:repo.name,msg:r.tag_name,desc:(r.body||'').split('\n')[0],date:r.published_at||r.created_at,url:r.html_url,src:'GitHub'}))}return items}).catch(()=>[]));const nested=await Promise.all(fetches);return nested.flat()}catch(e){return results}}async function fetchRSS(){try{const res=await fetch(CORS+encodeURIComponent('https://news.google.com/rss/search?q=AcreetionOS+Linux&hl=en-US&gl=US&ceid=US:en'));if(!res.ok)return[];const txt=await res.text();const items=txt.match(/<item>[\s\S]*?<\/item>/gi)||[];return items.slice(0,6).map(item=>{const title=(item.match(/<title>(?:<!\[CDATA\[)?([^\]]*)(?:\]\]>)?<\/title>/i)||[,''])[1].trim();const link=(item.match(/<link[^>]*>([^<]*)<\/link>/)||[,''])[1].trim();const desc=(item.match(/<description>(?:<!\[CDATA\[)?([^\]]*)(?:\]\]>)?<\/description>/i)||[,''])[1].replace(/<[^>]+>/g,'').slice(0,200);const date=(item.match(/<pubDate>([^<]*)<\/pubDate>/i)||[,''])[1];if(title&&link)return{type:'news',msg:title,desc,date,url:link,src:'Google News'};return null}).filter(Boolean)}catch(e){return[]}}async function generateAI(count){const sample=activityData.slice(0,8).map(d=>{if(d.type==='release')return'[REL] '+d.repo+' '+d.msg+': '+(d.desc||'');if(d.type==='news')return'[NEWS] '+d.msg;return'[COMMIT] '+d.repo+' '+d.msg}).join('\n');try{const res=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+OR_KEY,'HTTP-Referer':'https://acreetionos.org','X-Title':'AcreetionOS News'},body:JSON.stringify({model:'inclusionai/ring-2.6-1t:free',messages:[{role:'system',content:'You write news about AcreetionOS Linux. Output exactly '+count+' articles as JSON array. Each: {title(max 55 chars), summary(1 sentence), tag(Release/Development/Community/Infrastructure), url(use a real URL from the context or https://acreetionos.org)}. JSON only. No markdown.'},{role:'user',content:'AcreetionOS activity:\n'+sample}],max_tokens:512})});if(!res.ok)throw new Error('AI call failed');const data=await res.json();let content=(data.choices?.[0]?.message?.content||'').replace(/```json\s*/gi,'').replace(/```\s*$/g,'').trim();return JSON.parse(content)}catch(e){console.error('AI error:',e);return[]}}async function init(){setStatus('Fetching from GitHub and Google News...');try{const[gh,rss]=await Promise.all([fetchGitHub(),fetchRSS()]);activityData=[...gh,...rss].sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));const direct=rss.slice(0,4).map(i=>({title:i.msg,desc:i.desc||'',tag:'Community',tagClass:'tag-community',url:i.url,source:'Google News',date:i.date}));const releases=gh.filter(d=>d.type==='release').slice(0,3).map(d=>({title:d.msg+' released',desc:d.desc||'New release for '+d.repo,tag:'Release',tagClass:'tag-release',url:d.url,source:d.src||'GitHub',date:d.date}));const articles=[...releases,...direct].slice(0,6);articles.forEach(a=>addArticle(a));subtitleEl.textContent=articles.length+' articles from GitHub and Google News';if(activityData.length>0){moreBtn.style.display='inline-block';moreBtn.onclick=async function(){moreBtn.disabled=true;moreBtn.textContent='Generating...';setStatus('AI generating articles...');const aiArts=await generateAI(3);if(aiArts.length>0){aiArts.forEach(a=>addArticle({title:a.title||'Untitled',desc:a.summary||a.desc||'',tag:a.tag||'Development',tagClass:'tag-'+(a.tag||'dev').toLowerCase().includes('release')?'release':(a.tag||'dev').toLowerCase().includes('community')?'community':(a.tag||'dev').toLowerCase().includes('infra')?'infra':'commit',url:a.url||'https://acreetionos.org',source:'AI',date:''}));subtitleEl.textContent=gridEl.querySelectorAll('.article').length+' articles — including AI';setStatus('Updated',false)}else{setStatus('AI generation had no results',false)}moreBtn.textContent='Want more about AcreetionOS?';moreBtn.disabled=false};setStatus('Loaded',false)}else{setStatus('No articles found',false)}}catch(e){console.error(e);showError('Could not load news: '+(e.message||'Failed to fetch'))}}init();</script></body></html>
