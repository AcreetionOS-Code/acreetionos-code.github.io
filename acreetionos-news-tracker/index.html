<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><meta name="description" content="Latest news about AcreetionOS — tracked from across the web." /><meta name="theme-color" content="#2ecc71" /><title>AcreetionOS News — Latest Updates</title><link rel="icon" href="https://acreetionos.org/acreetionoslogo.webp" /><link href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" /><style>:root{--green:#2ecc71;--body-bg:#121212;--panel-bg:#1a1a1a;--box-bg:#222;--box-border:#333;--text-bright:#e5e5e5;--text:#b2b2b2;--purple:#9b59b6;--font-sans:'Roboto',sans-serif;--font-mono:'Fira Code',monospace}*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--font-sans);background:var(--body-bg);color:var(--text-bright);line-height:1.6;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,0.03) 1px,transparent 0);background-size:40px 40px}.header{background:rgba(24,26,27,0.85);backdrop-filter:blur(12px);border-bottom:2px solid var(--green);border-radius:0 0 16px 16px;position:sticky;top:0;z-index:100;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto}.header h1{font-family:var(--font-mono);font-size:1.5rem;color:var(--green)}.header a{color:var(--text);text-decoration:none;font-weight:500;margin-left:1.5rem}.header a:hover{color:var(--text-bright)}.container{max-width:1200px;margin:2rem auto;padding:0 2rem}.search-bar{background:var(--panel-bg);border:1px solid var(--box-border);border-radius:12px;padding:1.5rem;margin-bottom:2rem;text-align:center}.search-bar p{color:var(--text);margin-bottom:1rem;font-size:1.05rem}.search-links{display:flex;flex-wrap:wrap;gap:0.75rem;justify-content:center}.search-links a{padding:0.6rem 1.2rem;border-radius:12px;font-weight:700;text-decoration:none;transition:all 0.2s;color:#000}.search-links a:hover{transform:translateY(-2px);box-shadow:0 0 15px rgba(46,204,113,0.4)}.search-links a.google{background:#4285f4}.search-links a.ddg{background:#de5833}.search-links a.bing{background:#008373}.search-links a.gh{background:#333;color:#fff}.search-links a.yt{background:#ff0000}.search-links a.reddit{background:#ff4500}.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.5rem;margin-top:1rem}.article{background:var(--box-bg);border:1px solid var(--box-border);border-radius:12px;overflow:hidden;transition:all 0.3s}.article:hover{transform:translateY(-3px);box-shadow:0 8px 32px rgba(46,204,113,0.15);border-color:var(--green)}.article-body{padding:1.5rem}.tag{display:inline-block;padding:0.25rem 0.75rem;border-radius:12px;font-size:0.8rem;font-weight:700;margin-bottom:0.75rem}.tag-release{background:rgba(46,204,113,0.2);color:var(--green)}.tag-community{background:rgba(155,89,182,0.2);color:var(--purple)}.tag-infra{background:rgba(97,175,239,0.2);color:#61afef}.tag-dev{background:rgba(243,156,18,0.2);color:#f39c12}.article h3{font-size:1.15rem;margin-bottom:0.5rem}.article h3 a{color:var(--text-bright);text-decoration:none}.article h3 a:hover{color:var(--green)}.article p{color:var(--text);font-size:0.95rem;margin-bottom:1rem}.article-meta{display:flex;justify-content:space-between;align-items:center;font-size:0.85rem;color:var(--text)}.article-meta a{color:var(--green);text-decoration:none;font-weight:600}.article-meta a:hover{text-decoration:underline}.footer{text-align:center;padding:2rem;margin-top:2rem;border-top:1px solid var(--box-border);color:var(--text);font-size:0.9rem}.footer a{color:var(--green);text-decoration:none}.footer a:hover{text-decoration:underline}.loading{text-align:center;padding:4rem 2rem;color:var(--text)}.loading span{animation:pulse 1.5s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:var(--body-bg)}::-webkit-scrollbar-thumb{background:var(--box-border);border-radius:10px}::-webkit-scrollbar-thumb:hover{background:var(--green)}@media(max-width:768px){.header{flex-direction:column;gap:0.75rem;padding:0.75rem 1rem}.container{padding:0 1rem}.news-grid{grid-template-columns:1fr}}</style></head><body><header class="header"><h1>AcreetionOS News</h1><nav><a href="https://acreetionos.org">Home</a><a href="https://acreetionos.org/developers.html">Developers</a></nav></header><div class="container"><div class="search-bar"><p>Search for AcreetionOS news across the web:</p><div class="search-links"><a class="google" href="https://www.google.com/search?q=AcreetionOS&amp;tbm=nws" target="_blank" rel="noopener">Google News</a><a class="ddg" href="https://duckduckgo.com/?q=AcreetionOS&amp;ia=news" target="_blank" rel="noopener">DuckDuckGo</a><a class="bing" href="https://www.bing.com/news/search?q=AcreetionOS" target="_blank" rel="noopener">Bing News</a><a class="gh" href="https://github.com/AcreetionOS-Code" target="_blank" rel="noopener">GitHub</a><a class="yt" href="https://www.youtube.com/results?search_query=AcreetionOS" target="_blank" rel="noopener">YouTube</a><a class="reddit" href="https://www.reddit.com/search/?q=AcreetionOS" target="_blank" rel="noopener">Reddit</a></div></div><h2 style="font-family:var(--font-mono);color:var(--green);margin-bottom:1rem">Latest Updates</h2><div class="news-grid" id="news-grid"></div></div><footer class="footer"><p>Part of the <a href="https://acreetionos.org">AcreetionOS</a> project ecosystem.</p><p>&copy; 2026 AcreetionOS Project. All rights reserved.</p></footer><script>const articles=[{tag:"Release",tagClass:"tag-release",title:"AcreetionOS 1.0 Now Available",url:"https://acreetionos.org",source:"acreetionos.org",desc:"AcreetionOS 1.0 has been officially released, bringing a stable Arch Linux-based experience with the Cinnamon desktop, XLibre stability, and a focus on repository sovereignty."},{tag:"Community",tagClass:"tag-community",title:"Community Reaches 1,300 Users",url:"https://acreetionos.org",source:"acreetionos.org",desc:"AcreetionOS has officially reached 1,300 users, driven by the tireless work of co-lead developer Darren Clift and the growing community."},{tag:"Infrastructure",tagClass:"tag-infra",title:"New GitLab Instance Launched",url:"https://gitlab.acreetionos.org",source:"gitlab.acreetionos.org",desc:"AcreetionOS has launched a self-hosted GitLab instance, providing a home for project repositories and community contributions."},{tag:"Development",tagClass:"tag-dev",title:"ArttulOS Side Project Announced",url:"https://arttulos.acreetionos.org",source:"arttulos.acreetionos.org",desc:"Co-lead developer Natalie has launched ArttulOS, a new side project focused on absolute stability and a seamless computing experience."},{tag:"Infrastructure",tagClass:"tag-infra",title:"Mirror Network Expanding",url:"https://acreetionos.org",source:"acreetionos.org",desc:"AcreetionOS is expanding its mirror network with Oregon State University Open Source Lab and RWTH Aachen University."},{tag:"Development",tagClass:"tag-dev",title:"Developers Page Updated",url:"https://acreetionos.org/developers.html",source:"acreetionos.org",desc:"The AcreetionOS developers page now features personal sites for Darren and Natalie, plus a new Natalie Tools dropdown."}];const grid=document.getElementById('news-grid');articles.forEach(a=>{const card=document.createElement('div');card.className='article';card.innerHTML='<div class="article-body"><span class="tag '+a.tagClass+'">'+a.tag+'</span><h3><a href="'+a.url+'" target="_blank" rel="noopener">'+a.title+'</a></h3><p>'+a.desc+'</p><div class="article-meta"><span>'+a.source+'</span><a href="'+a.url+'" target="_blank" rel="noopener">Read More</a></div></div>';grid.appendChild(card)});</script></body></html>
