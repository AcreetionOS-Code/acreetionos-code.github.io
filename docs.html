<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcreetionOS Documentation (Coming Soon)</title>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: #2ecc71; }
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: #121212;
            color: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        .container {
            max-width: 700px;
            padding: 2rem;
            animation: fadeIn 1s ease-out;
        }

        .icon {
            font-size: 4rem;
            color: #2ecc71;
            margin-bottom: 1rem;
        }

        h1 {
            color: #2ecc71;
            font-family: 'Fira Code', monospace;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .description {
            display: inline-block;
            overflow: hidden;
            border-right: .15em solid #2ecc71;
            white-space: nowrap;
            margin: 0 auto;
            letter-spacing: .1em;
            animation:
                typing 3.5s steps(40, end),
                blink-caret .75s step-end infinite;
        }
        
        p {
            font-size: 1.2rem;
            color: #b2b2b2;
            line-height: 1.6;
        }

        #countdown-container {
            margin-top: 2rem;
            font-size: 1.2rem;
        }

        #countdown {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2ecc71;
        }

        #progress-bar-container {
            width: 100%;
            max-width: 400px;
            height: 8px;
            background-color: #2a2a2a;
            border-radius: 12px;
            margin: 1rem auto 0;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            background-color: #2ecc71;
            border-radius: 12px;
            width: 100%;
            transition: width 0.3s linear;
        }
        
        .notify-btn {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.8rem 2rem;
            background-color: #2ecc71;
            color: #121212;
            text-decoration: none;
            font-weight: bold;
            border-radius: 12px;
            transition: background-color 0.3s ease;
        }

        .notify-btn:hover {
            background-color: #27ae60;
        }

        .notify-btn.notified {
            background-color: #666;
            cursor: default;
            pointer-events: none;
        }

        .notify-btn.notified:hover {
            background-color: #666;
        }

        #notification-banner {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #2ecc71;
            color: #121212;
            padding: 1rem;
            text-align: center;
            font-weight: bold;
            z-index: 1000;
            cursor: pointer;
        }

    
::-webkit-scrollbar{width:10px;}::-webkit-scrollbar-track{background:var(--acreetion-body-bg,#121212);}::-webkit-scrollbar-thumb{background:var(--acreetion-box-border,#333);border-radius:10px;}::-webkit-scrollbar-thumb:hover{background:var(--acreetion-green,#2ecc71);}
.btn{transition:all 0.3s ease;}.btn:hover{box-shadow:0 0 15px rgba(46,204,113,0.4);transform:translateY(-2px);}.content-box{transition:transform 0.3s ease,box-shadow 0.3s ease;}.content-box:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,0.5);}
.reveal{opacity:0;transform:translateY(30px);transition:all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);will-change:opacity, transform;}.reveal.active{opacity:1;transform:translateY(0);}


html{scroll-behavior:smooth;}
::selection{background:rgba(46,204,113,0.3);color:var(--acreetion-text-bright,#fff);}
:focus-visible{outline:2px solid var(--acreetion-green,#2ecc71);outline-offset:3px;border-radius:4px;}
a:focus-visible,button:focus-visible{outline:2px solid var(--acreetion-green,#2ecc71);outline-offset:3px;}
.skip-link{position:absolute;top:-40px;left:0;background:var(--acreetion-green,#2ecc71);color:#000;padding:8px 16px;text-decoration:none;font-weight:700;z-index:10000;transition:top 0.3s;border-radius:0 0 8px 0;}
.skip-link:focus{top:0;}
@media (prefers-reduced-motion: reduce) {
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;scroll-behavior:auto !important;}
}


@keyframes pageLoadFade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
body{animation:pageLoadFade 0.6s ease-out;}
@media (prefers-reduced-motion: reduce){body{animation:none;}}


a{color:var(--acreetion-green,#2ecc71);text-decoration:none;position:relative;}
a:not(.btn):not(.logo):not(.skip-link):not(.social-link):hover{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px;}

</style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="notification-banner"></div>
    <div class="container">
        <div class="icon">🤖</div>
        <h1>AIDEN is powering up...</h1>
        <p class="description">Our new AI documentation assistant is in training.</p>
        <p>AIDEN will provide instant, context-aware help for all things AcreetionOS, from installation to advanced configuration.</p>
        
        <button id="notify-btn" class="notify-btn">Notify Me When It's Ready</button>

        <div id="countdown-container">
            <p>Redirecting to the home page in <span id="countdown">15</span> seconds...</p>
            <div id="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
        </div>
    </div>
    <script>
        function setCookie(name, value, days) {
            const expires = days ? `; expires=${new Date(Date.now() + days * 864e5).toUTCString()}` : '';
            document.cookie = `${name}=${encodeURIComponent(value)}${expires}; path=/; SameSite=Lax`;
        }

        function getCookie(name) {
            const match = document.cookie.match(new RegExp(`(^| )${name}=([^;]+)`));
            return match ? decodeURIComponent(match[2]) : null;
        }

        function deleteCookie(name) {
            document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/`;
        }

        const notifyBtn = document.getElementById('notify-btn');
        const notificationBanner = document.getElementById('notification-banner');

        if (getCookie('aiden_notify_subscribed')) {
            notifyBtn.textContent = 'Subscribed ✓';
            notifyBtn.classList.add('notified');
        }

        if (getCookie('aiden_online_notified')) {
            showOnlineNotification();
        }

        notifyBtn.addEventListener('click', () => {
            setCookie('aiden_notify_subscribed', 'true');
            notifyBtn.textContent = 'Subscribed ✓';
            notifyBtn.classList.add('notified');
            
            notificationBanner.style.display = 'block';
            notificationBanner.textContent = '🔔 You will be notified when AIDEN docs go live!';
            
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification('AcreetionOS', {
                    body: 'You will be notified when AIDEN docs go live!',
                    icon: '/logo.webp'
                });
            }
        });

        function showOnlineNotification() {
            notificationBanner.style.display = 'block';
            notificationBanner.textContent = '🎉 AIDEN Docs are now LIVE! Click to explore.';
            deleteCookie('aiden_online_notified');
            
            notificationBanner.addEventListener('click', () => {
                window.location.href = 'https://aiden.acreetionos.org';
            });
        }

        let countdownElement = document.getElementById('countdown');
        let progressBar = document.getElementById('progress-bar');
        let countdownContainer = document.getElementById('countdown-container');
        let timeLeft = 15;
        let totalTime = 15;
        let isPaused = false;

        let countdownInterval = setInterval(() => {
            if (isPaused) return;
            timeLeft--;
            countdownElement.textContent = timeLeft;
            progressBar.style.width = (timeLeft / totalTime * 100) + '%';
            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                window.location.href = 'index.html';
            }
        }, 1000);

        function togglePause() {
            isPaused = !isPaused;
            countdownElement.textContent = isPaused ? '⏸' : timeLeft;
        }

        function goNow() {
            clearInterval(countdownInterval);
            window.location.href = 'index.html';
        }

        countdownContainer.style.cursor = 'pointer';
        countdownContainer.addEventListener('click', () => {
            if (timeLeft > 0) {
                togglePause();
            } else {
                goNow();
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').then(() => {
                navigator.serviceWorker.addEventListener('message', (event) => {
                    if (event.data && event.data.type === 'AIDEN_STATUS' && event.data.online) {
                        showOnlineNotification();
                    }
                });
            }).catch(() => {});
        }

        async function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                await Notification.requestPermission();
            }
        }
        requestNotificationPermission();
    </script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if(entry.isIntersecting) {
                entry.target.classList.add('active');
                observer.unobserve(entry.target);
            }
        });
    }, { threshold: 0.05, rootMargin: "0px 0px -30px 0px" });
    document.querySelectorAll('.content-box, .dev-card, .event-card, .repo-card').forEach(el => {
        el.classList.add('reveal');
        observer.observe(el);
    });
});
</script>
</body>
</html>
