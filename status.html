/* status page styles */
.status-hero{text-align:center;margin-bottom:2.5rem;padding:2rem 1rem 1rem}
.status-hero h1{font-size:2rem;font-weight:700;color:var(--acreetion-text-bright);margin-bottom:0.5rem}
.status-hero h1 i{color:var(--acreetion-green);margin-right:0.5rem}
.status-hero p{color:var(--acreetion-text);font-size:1rem}
.status-summary{display:flex;align-items:center;justify-content:center;gap:0.75rem;margin-top:1rem;font-size:0.95rem;color:var(--acreetion-text)}
.status-summary .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.status-summary .dot.green{background:#2ecc71;box-shadow:0 0 8px rgba(46,204,113,0.5)}
.status-summary .dot.red{background:#e74c3c;box-shadow:0 0 8px rgba(231,76,60,0.5)}
.status-summary .dot.yellow{background:#f39c12;box-shadow:0 0 8px rgba(243,156,18,0.5)}
.status-controls{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.75rem;margin-bottom:1.5rem;padding:0.75rem 1rem;background:var(--acreetion-panel-bg);border:1px solid var(--acreetion-box-border);border-radius:10px}
.status-controls .note{color:var(--acreetion-text);font-size:0.82rem}
.status-controls .note i{margin-right:0.3rem}
.btn-refresh{background:var(--acreetion-green);color:#000;border:none;padding:0.55rem 1.2rem;border-radius:8px;font-weight:600;font-size:0.9rem;cursor:pointer;display:inline-flex;align-items:center;gap:0.4rem;transition:opacity.15s}
.btn-refresh:hover{opacity:0.85}
.btn-refresh:disabled{opacity:0.5;cursor:not-allowed}
.btn-refresh i{font-size:1rem}
.btn-refresh.spin i{animation:spin 1s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.services-grid{display:flex;flex-direction:column;gap:0.75rem}
.service-card{background:var(--acreetion-box-bg);border:1px solid var(--acreetion-box-border);border-radius:12px;padding:1rem 1.25rem;display:flex;align-items:center;gap:1rem;transition:border-color.2s,box-shadow.2s}
.service-card:hover{border-color:#444}
.service-icon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--acreetion-green);background:rgba(46,204,113,0.08);border-radius:10px;flex-shrink:0}
.service-info{flex:1;min-width:0}
.service-name{font-weight:600;font-size:1rem;color:var(--acreetion-text-bright);margin-bottom:0.15rem}
.service-url{font-size:0.78rem;color:#666;font-family:var(--font-mono);word-break:break-all}
.service-status{display:flex;align-items:center;gap:0.6rem;flex-shrink:0}
.status-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;transition:background.3s,box-shadow.3s}
.status-dot.green{background:#2ecc71;box-shadow:0 0 10px rgba(46,204,113,0.4)}
.status-dot.red{background:#e74c3c;box-shadow:0 0 10px rgba(231,76,60,0.4)}
.status-dot.yellow{background:#f39c12;box-shadow:0 0 10px rgba(243,156,18,0.4)}
.status-dot.grey{background:#555}
.status-text{font-size:0.85rem;font-weight:500;white-space:nowrap}
.status-text.green{color:#2ecc71}
.status-text.red{color:#e74c3c}
.status-text.yellow{color:#f39c12}
.status-text.grey{color:#777}
.service-meta{text-align:right;flex-shrink:0;min-width:90px}
.service-meta .label{font-size:0.72rem;color:#666;text-transform:uppercase;letter-spacing:0.3px}
.service-meta .value{font-size:0.82rem;color:var(--acreetion-text);font-family:var(--font-mono)}
.incident-section{margin-top:3rem;padding:1.5rem;background:var(--acreetion-panel-bg);border:1px solid var(--acreetion-box-border);border-radius:12px}
.incident-section h2{font-size:1.2rem;color:var(--acreetion-text-bright);margin-bottom:0.75rem;display:flex;align-items:center;gap:0.5rem}
.incident-section h2 i{color:var(--acreetion-green)}
.incident-placeholder{color:var(--acreetion-text);font-size:0.92rem;padding:1rem 0 0.25rem}
.last-checked-bar{font-size:0.78rem;color:#666;text-align:center;margin-top:1rem}
@media(max-width:600px){.service-card{flex-wrap:wrap;gap:0.75rem}.service-status{width:100%;justify-content:flex-start;padding-top:0.25rem}.service-meta{text-align:left;width:100%;display:flex;gap:1rem}.service-meta .label{margin-right:0.2rem}}
