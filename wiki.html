<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Cache-Control" content="max-age=3600">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="keywords" content="AcreetionOS, Arch Linux, Wiki, Documentation" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <!-- Security Policy: allow Arch Wiki and the site's AI proxy -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://wiki.archlinux.org; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://wiki.archlinux.org /api/chat; frame-ancestors 'none'; base-uri 'self';" />
  <title>AcreetionOS - Wiki Hub</title>
  <link rel="icon" type="image/webp" href="acreetionoslogo.webp">
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root{--acreetion-green:#2ecc71;--acreetion-body-bg:#121212;--font-sans:'Roboto',sans-serif}
    body{font-family:var(--font-sans);background:#121212;color:#e5e5e5}
    .page-wrapper{max-width:1100px;margin:2rem auto;padding:1rem;display:flex;gap:1rem}
    .main-column{flex:1}
    .sidebar-column{width:260px}
    .content-box{background:#1a1a1a;padding:1rem;border-radius:8px;border:1px solid #222}
    .search-form{display:flex;gap:.5rem}
    .search-input{flex:1;padding:.6rem;border-radius:6px;border:1px solid #333;background:#111;color:#e5e5e5}
    .search-btn{padding:.6rem 1rem;border-radius:6px;border:none;background:var(--acreetion-green);color:#0b0b0b}
    .results-list{margin-top:1rem}
    .page-footer{text-align:center;margin-top:2rem;color:#aaa}
  </style>
</head>
<body>
  <header class="page-header">
    <div style="max-width:1100px;margin:0 auto;padding:1rem;display:flex;align-items:center;gap:1rem;">
      <img src="acreetionoslogo.webp" alt="logo" style="height:36px">
      <h1 style="font-family:var(--font-sans);font-weight:500;color:var(--acreetion-green);">AcreetionOS Wiki Hub</h1>
    </div>
  </header>
  <main class="page-wrapper">
    <article class="main-column">
      <div class="content-box">
        <h2>Search the Wiki</h2>
        <p>Enter a topic to get a short beginner-friendly guide generated from trusted sources.</p>
        <form id="wiki-search-form" class="search-form">
          <input id="wiki-search-input" class="search-input" placeholder="Search e.g. WiFi, Bluetooth" />
          <button class="search-btn">Search</button>
        </form>
        <div id="results-list" class="results-list"></div>
      </div>
    </article>
    <aside class="sidebar-column">
      <div class="content-box">
        <h3>Resources</h3>
        <ul style="list-style:none;padding-left:0;font-size:0.95rem">
          <li><a href="install.html">Installation Guide</a></li>
          <li><a href="faq.html">FAQ</a></li>
          <li><a href="https://wiki.archlinux.org/" target="_blank">Arch Wiki</a></li>
        </ul>
      </div>
    </aside>
  </main>

  <footer class="page-footer"><p>AcreetionOS Project © 2026</p></footer>

  <script>
  document.getElementById('wiki-search-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var q = document.getElementById('wiki-search-input').value.trim();
    var results = document.getElementById('results-list');
    if (!q) return;
    results.innerHTML = '<div style="padding:1rem;color:var(--acreetion-green)">Searching…</div>';
    try {
      var res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type':'application/json' }, body: JSON.stringify({ messages: [{ role: 'system', content: 'Provide a short beginner guide about: ' + q }] }) });
      var data = await res.json();
      if (data && data.content) {
        results.innerHTML = '<div class="content-box"><h3>' + q + '</h3><div style="white-space:pre-wrap;padding-top:.5rem;color:#cfcfcf">' + data.content + '</div></div>';
      } else {
        results.innerHTML = '<div style="padding:1rem;color:#ccc">No results.</div>';
      }
    } catch (err) {
      results.innerHTML = '<div style="padding:1rem;color:#d66">Error fetching results.</div>';
    }
  });
  </script>
</body>
</html>
