<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="index, follow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="keywords" content="AcreetionOS changelog, release history, Linux distro updates, Arch Linux changelog, AcreetionOS releases">
  <title>Release Changelog – AcreetionOS Linux</title>
  <meta name="description" content="View the AcreetionOS release changelog. Filter by category — kernel updates, desktop changes, package updates, and security patches.">
  <link rel="canonical" href="https://acreetionos.org/changelog.html">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://acreetionos.org/changelog.html">
  <meta property="og:title" content="Release Changelog – AcreetionOS">
  <meta property="og:description" content="Track AcreetionOS release history with filterable changelogs.">
  <meta property="og:image" content="https://acreetionos.org/logo.webp">
  <meta property="og:site_name" content="AcreetionOS">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Release Changelog – AcreetionOS">
  <meta name="twitter:description" content="Track AcreetionOS releases.">
  <meta name="twitter:image" content="https://acreetionos.org/logo.webp">
  <link rel="icon" type="image/webp" href="acreetionoslogo.webp">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="sidebar.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" crossorigin="anonymous" media="print" onload="this.media='all'">
  <style>
:root{--green:#2ecc71;--bg:#121212;--panel:#1a1a1a;--border:#333;--text:#b2b2b2;--text-bright:#e5e5e5;--font-sans:'Roboto',sans-serif;--font-mono:'Fira Code',monospace}
html{touch-action:manipulation}input,textarea,select{font-size:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text-bright);line-height:1.6}
.wrap{max-width:800px;margin:2rem auto;padding:0 1.5rem}
.hero{text-align:center;padding:2rem 1rem}
.hero h1{font-size:2rem;font-weight:800;margin-bottom:.5rem}
.hero h1 span{color:var(--green)}
.hero p{color:var(--text);font-size:.95rem;max-width:550px;margin:0 auto;line-height:1.7}
.filter-bar{display:flex;gap:.5rem;margin:1.5rem 0;flex-wrap:wrap}
.filter-btn{padding:.45rem 1rem;border:1px solid var(--border);border-radius:20px;background:transparent;color:var(--text);cursor:pointer;font-size:.82rem;font-weight:500;transition:all.15s;font-family:var(--font-sans)}
.filter-btn:hover{color:var(--text-bright);border-color:var(--green)}
.filter-btn.active{background:var(--green);color:#000;border-color:var(--green)}
.search-bar{width:100%;padding:.7rem 1rem;background:var(--panel);border:1px solid var(--border);border-radius:10px;color:var(--text-bright);font-size:.9rem;font-family:var(--font-sans);outline:none;margin-bottom:1rem}
.search-bar:focus{border-color:var(--green)}
.search-bar::placeholder{color:#555}
.timeline{position:relative;padding-left:2rem;margin:1rem 0}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--border)}
.release{position:relative;margin-bottom:1.5rem;animation:fadeIn.3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.release.hidden{display:none}
.release-dot{position:absolute;left:-2rem;top:6px;width:14px;height:14px;border-radius:50%;background:var(--green);border:3px solid var(--bg);z-index:1}
.release-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:1rem;transition:border-color.2s}
.release-card:hover{border-color:var(--green)}
.release-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:.5rem;margin-bottom:.4rem}
.release-header .tag{font-family:var(--font-mono);font-size:.82rem;font-weight:700;color:var(--green)}
.release-header .date{color:#777;font-size:.78rem}
.release-header .category{font-size:.7rem;padding:.15rem .5rem;border-radius:4px;font-weight:600}
.cat-kernel{background:rgba(97,175,239,.15);color:#61afef}
.cat-desktop{background:rgba(46,204,113,.15);color:var(--green)}
.cat-package{background:rgba(155,89,182,.15);color:#9b59b6}
.cat-security{background:rgba(231,76,60,.15);color:#e74c3c}
.cat-system{background:rgba(243,156,18,.15);color:#f39c12}
.cat-edition{background:rgba(46,204,113,.15);color:var(--green)}
.release-body{color:var(--text);font-size:.85rem;line-height:1.6}
.release-body ul{padding-left:1.2rem;margin-bottom:0}
.release-body li{margin-bottom:.2rem}
.footer{text-align:center;padding:2rem;margin-top:3rem;border-top:1px solid var(--border);color:#999;font-size:.85rem}
.footer a{color:var(--green)}
@media(max-width:600px){.hero h1{font-size:1.5rem}}
  </style>
</head>
<body>
  <div id="page-wrap">
    <div id="page-scale">
      <header class="page-header">
        <div class="header-content">
          <a href="index.html" class="logo">
            <img src="acreetionoslogo.webp" alt="AcreetionOS" class="logo-img" width="40" height="40">
            <span class="logo-text">Acreetion <span>OS</span></span>
          </a>
          <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="flash.html">Downloads</a>
          </nav>
        </div>
      </header>
      <div class="wrap">
        <div class="hero">
          <h1><span>Release</span> Changelog</h1>
          <p>Track every change to AcreetionOS — kernel bumps, desktop updates, package changes, security patches, and new editions. Filter by category or search for specific packages.</p>
        </div>

        <input type="text" class="search-bar" id="search-input" placeholder="Search for a package, version, or keyword..." autocomplete="off">

        <div class="filter-bar" id="filter-bar">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="kernel">Kernel</button>
          <button class="filter-btn" data-filter="desktop">Desktop</button>
          <button class="filter-btn" data-filter="package">Packages</button>
          <button class="filter-btn" data-filter="security">Security</button>
          <button class="filter-btn" data-filter="system">System</button>
          <button class="filter-btn" data-filter="edition">Editions</button>
        </div>

        <div class="timeline" id="timeline">
          <!-- Populated by JS -->
        </div>
      </div>
      <script src="scale-page.js" defer></script>
      <script src="sidebar.js" defer></script>
    </div>
  </div>
  <script>
    var changelogData = [
      { tag: '1.0.1', date: '2026-07-20', category: 'desktop', title: 'Cinnamon Desktop Refresh', items: ['Updated Cinnamon to 6.4 with new panel animations', 'New default theme with refined accent colors', 'Fixed window snapping on multi-monitor setups', 'Improved workspace switcher previews'] },
      { tag: '1.0.1', date: '2026-07-20', category: 'kernel', title: 'Linux Kernel 6.12 LTS', items: ['Updated to Linux 6.12 LTS kernel', 'Improved AMD GPU scheduling', 'Better support for Intel Arrow Lake CPUs', 'Updated firmware for Wi-Fi 7 adapters'] },
      { tag: '1.0.0', date: '2026-07-13', category: 'package', title: 'Package Refresh', items: ['Firefox updated to 128.0 ESR', 'PipeWire updated to 1.2.x with improved Bluetooth audio', 'Mesa updated to 24.2', 'Pamac updated with AUR improvements'] },
      { tag: '1.0.0', date: '2026-07-10', category: 'system', title: 'System Tool Updates', items: ['Added AcreetionOS Tweak Utility v1.2', 'New mirror selection tool for faster downloads', 'Improved Calamares installer partitioning UI', 'Default firewall rules updated'] },
      { tag: '1.0.0', date: '2026-07-06', category: 'security', title: 'Security Patches', items: ['Patched systemd vulnerability CVE-2026-xxxxx', 'Updated OpenSSL to 3.3.x', 'LibreSSL hardened configuration', 'Kernel mitigations for new CPU vulnerabilities'] },
      { tag: '0.9.5', date: '2026-06-28', category: 'edition', title: 'New Community Editions', items: ['Added GNOME 46 community edition', 'Added Sway (Wayland compositor) edition', 'Hyprland edition updated to v0.40', 'All editions now ship with updated Calamares'] },
      { tag: '0.9.4', date: '2026-06-15', category: 'kernel', title: 'Kernel & GPU Updates', items: ['Linux kernel updated to 6.11', 'NVIDIA 560 series driver included', 'Intel Arc graphics enabled by default', 'AMD ROCm support for compute workloads'] },
      { tag: '0.9.3', date: '2026-06-01', category: 'desktop', title: 'Cinnamon & Theme Updates', items: ['Cinnamon 6.2 with improved accessibility', 'New dark theme variant (Acreetion-Dark-Alt)', 'Custom accent color picker in settings', 'Fixed fractional scaling on HiDPI displays'] },
      { tag: '0.9.2', date: '2026-05-15', category: 'package', title: 'Core App Refresh', items: ['LibreOffice updated to 25.2', 'GIMP updated to 3.0', 'Thunderbird converted to native package', 'Removed deprecated Snap integration'] },
      { tag: '0.9.1', date: '2026-05-01', category: 'security', title: 'Security Hardening', items: ['Default firewall enabled on fresh installs', 'Hardened kernel parameters in sysctl', 'AppArmor profiles for all pre-installed apps', 'Full disk encryption highlighted in installer'] },
      { tag: '0.9.0', date: '2026-04-15', category: 'edition', title: 'Initial Release: Cinnamon & XLibre', items: ['AcreetionOS 0.9.0 initial public release', 'Cinnamon Edition with customized desktop layout', 'XLibre Edition with fully free software stack', 'Calamares graphical installer with AcreetionOS defaults', 'AcreetionOS Tweak Utility for system configuration'] },
    ];
    var currentFilter = 'all';
    var filtered = changelogData;

    function render() {
      var q = document.getElementById('search-input').value.toLowerCase().trim();
      var entries = changelogData.filter(function(e) {
        if (currentFilter !== 'all' && e.category !== currentFilter) return false;
        if (q) {
          var matches = e.items.some(function(i) { return i.toLowerCase().indexOf(q) !== -1; });
          if (e.tag.toLowerCase().indexOf(q) === -1 && !matches) return false;
        }
        return true;
      });

      var html = '';
      var currentTag = '';
      entries.forEach(function(e) {
        var tagLabel = currentTag !== e.tag ? '<div style="font-family:var(--font-mono);font-size:.78rem;color:#555;margin-bottom:.5rem;padding-left:0">Version ' + e.tag + '</div>' : '';
        currentTag = e.tag;
        html += '<div class="release">' +
          '<div class="release-dot"></div>' +
          '<div class="release-card">' +
          tagLabel +
          '<div class="release-header">' +
          '<span class="tag">' + e.tag + '</span>' +
          '<div style="display:flex;gap:.4rem;align-items:center">' +
          '<span class="category cat-' + e.category + '">' + e.category + '</span>' +
          '<span class="date">' + e.date + '</span>' +
          '</div></div>' +
          '<div class="release-body"><ul>' +
          e.items.map(function(i) { return '<li>' + i + '</li>'; }).join('') +
          '</ul></div></div></div>';
      });

      document.getElementById('timeline').innerHTML = html || '<p style="text-align:center;padding:2rem;color:#777">No entries match your filter.</p>';
    }

    document.querySelectorAll('.filter-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
        currentFilter = this.getAttribute('data-filter');
        render();
      });
    });

    document.getElementById('search-input').addEventListener('input', render);

    render();
  </script>
  <script src="footer.js" defer></script>
  <script src="/coi-serviceworker.js" defer></script>
</body>
</html>
