<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bluesky Login | AcreetionOS</title>
  <link rel="stylesheet" href="contact.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: var(--acreetion-panel-bg, #181a1b);
      color: var(--acreetion-text, #e0e0e0);
      font-family: var(--font-sans, FreeSans, Arial, sans-serif);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    a {
      color: var(--acreetion-green, #2ecc71);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .redirect-box {
      background: var(--acreetion-box-bg, #23272a);
      border: 1px solid var(--acreetion-box-border, #2ecc71);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.2);
      max-width: 480px;
      text-align: center;
      margin: 2rem;
    }
    .redirect-title {
      color: var(--acreetion-green, #2ecc71);
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .redirect-msg {
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
      line-height: 1.5;
    }
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 2rem;
    }
    .btn {
      display: inline-block;
      padding: 0.8rem 1.5rem;
      border-radius: 12px;
      font-weight: bold;
      text-decoration: none !important;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--acreetion-green, #2ecc71);
      color: #111;
      border: 1px solid var(--acreetion-green, #2ecc71);
    }
    .btn-primary:hover {
      background: #27ae60;
      border-color: #27ae60;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--acreetion-green, #2ecc71);
      color: var(--acreetion-green, #2ecc71);
    }
    .btn-secondary:hover {
      background: rgba(46, 204, 113, 0.1);
    }
    @media(max-width:600px){
      .redirect-box{padding:1.5rem 1rem;}
    }
  </style>
</head>
<body>
  <div class="redirect-box">
    <div class="redirect-title">Heading to Bluesky</div>
    <div class="redirect-msg">
      You are being redirected to Bluesky's primary page to log in. Our official instance is located at <strong>bsky.acreetionos.org</strong>.
    </div>
    <div class="redirect-msg" style="font-size: 0.95rem; color: #aaa;">
      Redirecting in <span id="countdown">15</span> seconds...
      <br><br>
      If you need to create an account, you can register directly on our instance.
    </div>
    
    <div class="btn-container">
      <a href="https://bsky.app/" class="btn btn-primary" id="login-btn">Login on Primary Page</a>
      <a href="https://bsky.acreetionos.org/register.html" class="btn btn-secondary" id="register-btn">Register on Our Instance</a>
    </div>
  </div>

  <script>
    let timeLeft = 15;
    const countdownEl = document.getElementById('countdown');
    let redirectTimer = setInterval(() => {
      timeLeft--;
      countdownEl.textContent = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(redirectTimer);
        window.location.href = "https://bsky.app/";
      }
    }, 1000);

    // Stop countdown if they click a button
    document.getElementById('register-btn').addEventListener('click', () => {
      clearInterval(redirectTimer);
    });
    document.getElementById('login-btn').addEventListener('click', () => {
      clearInterval(redirectTimer);
    });
  </script>
</body>
</html>
