name: Add DNS Record for trumpos
on: workflow_dispatch
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Get zone and add CNAME
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=acreetionos.org" \
            -H "Authorization: Bearer $CF_TOKEN" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('result') else '')")
          echo "Zone: $ZONE_ID"
          if [ -n "$ZONE_ID" ]; then
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"type":"CNAME","name":"trumpos","content":"spivanatalie64.github.io","ttl":1,"proxied":true}' | \
              python3 -c "import sys,json; r=json.load(sys.stdin); print('✓' if r.get('success') else '✗ DNS:', r.get('errors',''))"
          fi
