name: Build TrumpOS ISO
on:
  schedule:
    - cron: '0 4 * * 6'  # Saturday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-trumpos:
    runs-on: ubuntu-latest
    container: archlinux:latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Initialize pacman and install build tools
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman-key --refresh-keys
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed \
            base-devel \
            archiso \
            squashfs-tools \
            xorriso \
            git \
            wget \
            p7zip
      
      - name: Verify mkarchiso is available
        run: |
          which mkarchiso || (echo "mkarchiso not found" && exit 1)
      
      - name: Build TrumpOS ISO
        run: bash TrumpOS/build.sh
      
      - name: Upload to GitLab Package Registry
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_REGISTRY_TOKEN }}
        run: |
          ISO_FILE=$(ls TrumpOS-*.iso 2>/dev/null | head -1)
          if [ -z "$ISO_FILE" ]; then
            echo "ERROR: No ISO produced"
            exit 1
          fi
          curl --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            --upload-file "$ISO_FILE" \
            "https://gitlab.acreetionos.org/api/v4/projects/acreetionos-code%2Ftrumpos/packages/generic/trumpos/1.0/$(basename $ISO_FILE)" \
            || echo "GitLab upload failed"
      
      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: trump-os-iso
          path: TrumpOS-*.iso
          retention-days: 7
  
  notify-fail:
    if: failure()
    needs: build-trumpos
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[CI] TrumpOS ISO build failed — ${new Date().toISOString().split('T')[0]}`,
              body: `Build failed. [View run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              assignees: ['spivanatalie64'],
              labels: ['build-failure']
            });
