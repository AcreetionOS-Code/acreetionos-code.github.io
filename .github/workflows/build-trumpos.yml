      - name: Setup Arch build environment
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed \
            base-devel \
            archiso \
            squashfs-tools \
            xorriso \
            git \
            wget \
            p7zip
          # Ensure mkarchiso is available (sometimes a symlink is needed)
          MKISO=$(command -v mkarchiso 2>/dev/null || find /usr -name 'mkarchiso*' -type f 2>/dev/null | head -1)
          if [ -n "$MKISO" ]; then
            echo "mkarchiso found at: $MKISO"
          else
            echo "ERROR: mkarchiso not found after install" && exit 1
          fi
      
      - name: Build TrumpOS ISO
        run: |
          # Use the explicit path to avoid PATH issues
          MKISO=$(find /usr -name 'mkarchiso*' -type f 2>/dev/null | head -1)
          "$MKISO" -C "$WORK/mkarchiso.conf" -w "$WORK" -D "$ISO_DIR" -O "$OUTPUT"