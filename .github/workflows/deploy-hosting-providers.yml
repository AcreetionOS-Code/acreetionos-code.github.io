name: Deploy Hosting Providers
on:
  workflow_dispatch:
  repository_dispatch:
    types: [update-providers]

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch providers from R2 and generate providers.json
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Fetch provider list from Cloudflare Worker API
          curl -s "https://acreetionos.org/api/hosting/providers" -o /tmp/providers.json
          echo "Providers fetched:"
          cat /tmp/providers.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'{len(d.get(\"providers\",[]))} providers')"

          # Generate providers-list.html snippet for inclusion
          python3 << 'PYEOF'
          import json
          with open('/tmp/providers.json') as f:
              data = json.load(f)
          providers = [p for p in data.get('providers', []) if p.get('status') == 'active']
          html = '<div class="mirror-list">\n'
          for p in providers:
              html += f'<div class="mirror-item">\n'
              html += f'<strong>{p.get("org","Unknown")}</strong>'
              if p.get('location'): html += f'<span class="mirror-location">{p["location"]}</span>'
              html += f'<a href="{p["mirror_url"]}" target="_blank" rel="noopener" class="btn btn-small">ISO Mirror</a>'
              if p.get('website'): html += f'<a href="{p["website"]}" target="_blank" rel="noopener" class="btn btn-small">Website</a>'
              html += '</div>\n'
          html += '</div>'
          with open('providers-list.html', 'w') as f:
              f.write(html)
          print('Generated providers-list.html')

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: main
          force_orphan: false
