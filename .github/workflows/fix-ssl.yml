name: Fix Cloudflare SSL Mode
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix-ssl:
    runs-on: ubuntu-latest
    steps:
      - name: Fix SSL Mode for natalie.acreetionos.org
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # First, get the zone ID
          ZONES=$(curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=acreetionos.org")
          ZONE_ID=$(echo "$ZONES" | jq -r '.result[0].id')
          echo "Zone ID: $ZONE_ID"
          
          # Check current SSL setting
          echo "=== Current SSL setting ==="
          curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/ssl" | jq .
          
          # Change SSL mode to Full (Strict)
          echo "=== Changing SSL mode to Full (Strict) ==="
          RESULT=$(curl -s -X PATCH \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/ssl" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"value": "strict"}')
          echo "$RESULT" | jq .
          
          # Verify the change
          echo "=== Verified SSL setting ==="
          curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/ssl" | jq .
