name: Deploy Natali Proxy Worker
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy Natali Proxy Worker
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -x
          ZONE_ID="5b3f8237bfa2518bff375eb8163623a5"
          WORKER_NAME="natalie-proxy"
          
          cat > /tmp/worker.js << 'WORKEREOF'
          addEventListener('fetch', event => {
            event.respondWith(handleRequest(event.request));
          });
          
          async function handleRequest(request) {
            try {
              const url = new URL(request.url);
              
              // First, try fetching from GH Pages directly with the custom domain host header
              const ghUrl = 'https://spivanatalie64.github.io' + url.pathname + url.search;
              
              const headers = new Headers(request.headers);
              headers.set('Host', 'natalie.acreetionos.org');
              headers.delete('CF-Connecting-IP');
              headers.delete('CF-IPCountry');
              headers.delete('CF-Ray');
              headers.delete('CDN-Loop');
              
              let response = await fetch(ghUrl, {
                method: request.method,
                headers: headers,
                body: request.body,
                redirect: 'manual',
              });
              
              // If we get a redirect to the custom domain, follow the redirect
              // but skip back to ourselves - fetch the redirect URL directly
              // from GitHub Pages IP
              if (response.status >= 300 && response.status < 400) {
                const location = response.headers.get('Location');
                
                if (location) {
                  const locUrl = new URL(location);
                  
                  // Use GH Pages domain instead of our domain to avoid loops
                  locUrl.hostname = 'spivanatalie64.github.io';
                  
                  const followHeaders = new Headers(headers);
                  followHeaders.set('Host', 'natalie.acreetionos.org');
                  
                  response = await fetch(locUrl.toString(), {
                    method: 'GET',
                    headers: followHeaders,
                    redirect: 'manual',
                  });
                }
              }
              
              const newHeaders = new Headers(response.headers);
              newHeaders.set('X-Proxied-By', 'natalie-worker');
              
              return new Response(response.body, {
                status: response.status,
                statusText: response.statusText,
                headers: newHeaders,
              });
            } catch (err) {
              return new Response('Worker Error: ' + err.message, {
                status: 500,
                headers: { 'Content-Type': 'text/plain' },
              });
            }
          }
          WORKEREOF
          
          cat > /tmp/metadata.json << 'METADATAEOF'
          {
            "body_part": "script",
            "bindings": [],
            "compatibility_date": "2026-06-20",
            "compatibility_flags": []
          }
          METADATAEOF
          
          curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/6a46b418508c26278ae2d3373f41da81/workers/scripts/$WORKER_NAME" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -F "metadata=@/tmp/metadata.json;type=application/json" \
            -F "script=@/tmp/worker.js;type=application/javascript" | jq .
          
          EXISTING_ROUTES=$(curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes")
          NATALIE_ROUTE_ID=$(echo "$EXISTING_ROUTES" | jq -r '.result[] | select(.pattern == "natalie.acreetionos.org/*") | .id')
          
          curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes/$NATALIE_ROUTE_ID" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"pattern\": \"natalie.acreetionos.org/*\",
              \"script\": \"$WORKER_NAME\"
            }" | jq .
          
          echo "=== Done ==="
