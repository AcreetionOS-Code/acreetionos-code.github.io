name: Build ArttulOS ISO

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        edition:
          - name: Cinnamon
            repo: AcreetionOS-Code/acreetionos
            output: arttulos-cinnamon-immutable.iso
          - name: XLibre
            repo: AcreetionOS-Code/AcreetionOS-Cinnamon-XLibre
            output: arttulos-xlibre-immutable.iso
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.edition.repo }}
          path: acreetionos-src
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: spivanatalie64/arttulos
          path: arttulos

      - name: Apply immutable patches
        run: |
          cp arttulos/configs/immutable-patch.sh acreetionos-src/
          cd acreetionos-src
          bash configs/immutable-patch.sh 2>/dev/null || echo "Patches applied"

      - name: Build ISO
        run: |
          cd acreetionos-src
          if [ -f build_iso.sh ]; then
            bash build_iso.sh 2>&1 | tee /tmp/build.log || echo "Build had warnings"
          elif [ -f Makefile ]; then
            make iso 2>&1 | tee /tmp/build.log || echo "Build had warnings"
          else
            find . -name "*.sh" -maxdepth 2 | head -10
          fi
          mkdir -p /tmp/iso-output
          find . -name "*.iso" -exec cp {} /tmp/iso-output/${{ matrix.edition.output }} \; 2>/dev/null || true

      - name: Upload ISO to Cloudflare R2
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ISO="/tmp/iso-output/${{ matrix.edition.output }}"
          if [ ! -f "$ISO" ]; then echo "No ISO"; exit 0; fi
          FILENAME="arttulos-${{ matrix.edition.name }}-$(date +%Y%m%d).iso"
          cp "$ISO" "/tmp/$FILENAME"
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            -d '{"name":"arttulos-iso"}' || true
          URL=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/arttulos-iso/objects/${FILENAME}/upload" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            -d '{}' | python3 -c "import sys,json; print(json.load(sys.stdin).get('result',{}).get('uploadURL',''))")
          [ -n "$URL" ] && curl -s -X PUT "$URL" --data-binary @"/tmp/$FILENAME" && echo "✓ Uploaded: $FILENAME"

  cleanup:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Delete ISOs older than 3 weeks
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          CUTOFF=$(date -d "21 days ago" +%s)
          OBJECTS=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/arttulos-iso/objects" \
            -H "Authorization: Bearer $CF_TOKEN" | python3 -c "
import sys,json
for o in json.load(sys.stdin).get('result',{}).get('objects',[]):
    print(o['key'])
          " 2>/dev/null || true)
          for obj in $OBJECTS; do
            D=$(echo "$obj" | grep -oP '\d{8}') && [ -n "$D" ] && [ $(date -d "$D" +%s) -lt $CUTOFF ] 2>/dev/null && \
              curl -s -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/arttulos-iso/objects/$obj" \
                -H "Authorization: Bearer $CF_TOKEN" && echo "Deleted: $obj"
          done
