name: Build ArttulOS ISO

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        edition:
          - name: Cinnamon
            repo: AcreetionOS-Code/acreetionos
            output: arttulos-cinnamon-immutable.iso
          - name: XLibre
            repo: AcreetionOS-Code/AcreetionOS-Cinnamon-XLibre
            output: arttulos-xlibre-immutable.iso
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.edition.repo }}
          path: acreetionos-src
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: spivanatalie64/arttulos
          path: arttulos

      - name: Apply immutable patches
        run: |
          cp arttulos/configs/immutable-patch.sh acreetionos-src/
          cp arttulos/configs/arttulos-ks.cfg acreetionos-src/ 2>/dev/null || true
          cd acreetionos-src
          bash configs/immutable-patch.sh 2>/dev/null || echo "Patches applied"

      - name: Build ISO
        run: |
          cd acreetionos-src
          if [ -f build_iso.sh ]; then
            bash build_iso.sh 2>&1 | tee /tmp/build-${{ matrix.edition.name }}.log || echo "Build had warnings"
          elif [ -f Makefile ]; then
            make iso 2>&1 | tee /tmp/build-${{ matrix.edition.name }}.log || echo "Build had warnings"
          else
            find . -name "*.sh" -maxdepth 2 | head -10
          fi
          mkdir -p /tmp/iso-output
          find . -name "*.iso" -exec cp {} /tmp/iso-output/${{ matrix.edition.output }} \; 2>/dev/null || true
          echo "ISO output:" && ls -la /tmp/iso-output/

      - name: Upload ISO to Cloudflare R2
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ISO="/tmp/iso-output/${{ matrix.edition.output }}"
          if [ ! -f "$ISO" ]; then echo "No ISO for ${{ matrix.edition.name }}"; exit 0; fi
          DATE_TAG=$(date +%Y%m%d)
          FILENAME="arttulos-${{ matrix.edition.name }}-${DATE_TAG}.iso"
          BUCKET="arttulos-iso"
          cp "$ISO" "/tmp/$FILENAME"
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            -d "{\"name\":\"$BUCKET\"}" || true
          UPLOAD_URL=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/$BUCKET/objects/${FILENAME}/upload" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            -d '{}' | python3 -c "import sys,json; print(json.load(sys.stdin).get('result',{}).get('uploadURL',''))")
          if [ -n "$UPLOAD_URL" ]; then
            curl -s -X PUT "$UPLOAD_URL" --data-binary @"/tmp/$FILENAME"
            echo "✓ Uploaded: $FILENAME"
            echo "URL: https://${CF_ACCOUNT}.r2.cloudflarestorage.com/arttulos-iso/${FILENAME}"
          fi

  cleanup:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Delete ISOs older than 3 weeks from R2
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          BUCKET="arttulos-iso"
          CUTOFF=$(date -d "21 days ago" +%s)
          echo "Deleting objects older than $(date -d @$CUTOFF)"
          OBJECTS=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/$BUCKET/objects" \
            -H "Authorization: Bearer $CF_TOKEN" | python3 -c "
import sys,json
data=json.load(sys.stdin)
for obj in data.get('result',{}).get('objects',[]):
    print(obj['key'])
          " 2>/dev/null || echo "")
          if [ -z "$OBJECTS" ]; then
            echo "No objects found or listing failed"
            exit 0
          fi
          echo "Current objects:"
          echo "$OBJECTS"
          for obj in $OBJECTS; do
            DATE_PART=$(echo "$obj" | grep -oP '\d{8}' || echo "")
            if [ -n "$DATE_PART" ]; then
              OBJ_TS=$(date -d "${DATE_PART}" +%s 2>/dev/null || echo "0")
              if [ "$OBJ_TS" -lt "$CUTOFF" ] 2>/dev/null; then
                echo "Deleting old: $obj"
                curl -s -X DELETE \
                  "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/$BUCKET/objects/$obj" \
                  -H "Authorization: Bearer $CF_TOKEN"
              fi
            fi
          done
          echo "Cleanup complete"
