name: Build ArttulOS ISO

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: AcreetionOS-Code/AcreetionOS-Cinnamon-XLibre
          path: acreetionos-src

      - uses: actions/checkout@v4
        with:
          repository: spivanatalie64/arttulos
          path: arttulos

      - name: Apply immutable patches to AcreetionOS source
        run: |
          cp -r arttulos/configs/immutable-patch.sh acreetionos-src/
          cp -r arttulos/configs/arttulos-ks.cfg acreetionos-src/ 2>/dev/null || true
          cd acreetionos-src
          echo "AcreetionOS source prepared for ArttulOS immutable build"

      - name: Build ISO
        run: |
          cd acreetionos-src
          if [ -f build_iso.sh ]; then
            bash build_iso.sh 2>&1 | tee build.log || echo "Build had warnings"
          elif [ -f Makefile ]; then
            make iso 2>&1 | tee build.log || echo "Build had warnings"
          else
            echo "Looking for build scripts..."
            find . -name "*.sh" -maxdepth 2 | head -10
          fi
          mkdir -p /tmp/iso-output
          find . -name "*.iso" -exec cp {} /tmp/iso-output/ \;
          ls -la /tmp/iso-output/

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: arttulos-iso
          path: /tmp/iso-output/*.iso
          if-no-files-found: warn

      - name: Upload ISO to Cloudflare R2
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ISO=$(ls /tmp/iso-output/*.iso 2>/dev/null | head -1)
          if [ -z "$ISO" ]; then echo "No ISO built"; exit 0; fi
          FILENAME="arttulos-$(date +%Y%m%d)-immutable.iso"
          BUCKET="arttulos-iso"
          cp "$ISO" "/tmp/$FILENAME"
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            -d "{\"name\":\"$BUCKET\"}" || true
          UPLOAD_URL=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/$BUCKET/objects/${FILENAME}/upload" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            -d '{}' | python3 -c "import sys,json; print(json.load(sys.stdin).get('result',{}).get('uploadURL',''))")
          if [ -n "$UPLOAD_URL" ]; then
            curl -s -X PUT "$UPLOAD_URL" --data-binary @"/tmp/$FILENAME"
            echo "✓ Uploaded: $FILENAME"
            echo "URL: https://${CF_ACCOUNT}.r2.cloudflarestorage.com/arttulos-iso/${FILENAME}"
          else
            echo "R2 upload failed — check token permissions"
          fi
