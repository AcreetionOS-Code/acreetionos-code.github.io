name: Build ArttulOS ISO
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        edition:
          - name: Cinnamon
            repo: AcreetionOS-Code/acreetionos
            output: arttulos-cinnamon.iso
          - name: XLibre
            repo: AcreetionOS-Code/AcreetionOS-Cinnamon-XLibre
            output: arttulos-xlibre.iso
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.edition.repo }}
          path: src
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: spivanatalie64/arttulos
          path: patches

      - name: Install archiso
        run: sudo pacman -Syu --noconfirm archiso || (echo "Not Arch, trying apt" && sudo apt-get update -qq && sudo apt-get install -y -qq mkarchiso archiso 2>/dev/null || echo "Will use Docker")

      - name: Apply immutable patches to airootfs
        run: |
          cp patches/configs/immutable-patch.sh src/
          if [ -d src/airootfs ]; then
            cp patches/configs/immutable-patch.sh src/airootfs/root/
            echo "Patches copied to airootfs"
          fi
          cd src
          echo "AcreetionOS + immutable patches ready"

      - name: Build ISO
        run: |
          cd src
          if [ -f build.sh ]; then
            chmod +x *.sh
            bash build.sh 2>&1 | tee /tmp/build.log || echo "Build failed in script"
          elif [ -f Makefile ]; then
            make 2>&1 | tee /tmp/build.log || echo "Build failed in make"
          fi
          mkdir -p /tmp/iso
          find .. -name "*.iso" -exec cp {} /tmp/iso/ \; 2>/dev/null || true
          find / -name "*.iso" -maxdepth 4 -exec cp {} /tmp/iso/ \; 2>/dev/null || true
          ls -la /tmp/iso/ 2>/dev/null || echo "No ISO found"

      - name: Upload ISO to R2
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ISO=$(ls /tmp/iso/*.iso 2>/dev/null | head -1)
          [ -z "$ISO" ] && echo "No ISO" && exit 0
          F="arttulos-${{ matrix.edition.name }}-$(date +%Y%m%d).iso"
          cp "$ISO" "/tmp/$F"
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets" -H "Authorization: Bearer $CF_TOKEN" -d '{"name":"arttulos-iso"}' || true
          U=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/arttulos-iso/objects/${F}/upload" -H "Authorization: Bearer $CF_TOKEN" -d '{}' | python3 -c "import sys,json; print(json.load(sys.stdin).get('result',{}).get('uploadURL',''))")
          [ -n "$U" ] && curl -s -X PUT "$U" --data-binary @"/tmp/$F" && echo "✓ Uploaded $F" || echo "R2 upload failed"

  cleanup:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Delete ISOs older than 3 weeks from R2
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          CUTOFF=$(date -d "21 days ago" +%s)
          for obj in $(curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/arttulos-iso/objects" -H "Authorization: Bearer $CF_TOKEN" | python3 -c "import sys,json;[print(o['key']) for o in json.load(sys.stdin).get('result',{}).get('objects',[])]" 2>/dev/null); do
            D=$(echo "$obj" | grep -oP '\d{8}') && [ -n "$D" ] && [ $(date -d "$D" +%s 2>/dev/null) -lt $CUTOFF ] 2>/dev/null && curl -s -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/arttulos-iso/objects/$obj" -H "Authorization: Bearer $CF_TOKEN" && echo "Deleted $obj"
          done
