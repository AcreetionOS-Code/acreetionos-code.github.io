name: Deploy dl-proxy
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy dl-proxy Worker
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -x
          AID="6a46b418508c26278ae2d3373f41da81"
          ZONE_ID="5b3f8237bfa2518bff375eb8163623a5"

          cat > /tmp/worker.js << 'JSEOF'
          // dl.acreonetionos.org — auto-routing for community ISOs
          const R2_PUBLIC = 'https://pub-173a1f638a3b4c95b5f58b09c0b968aa.r2.dev/acreetionos-isos';

          const EDITIONS = {
            '32bit':     { name: '32-bit',      badge: 'i686',     desc: 'AcreetionOS for 32-bit (i686) architectures. Perfect for reviving older hardware.', de: 'Cinnamon', disp: 'XLibre', arch: 'i686' },
            'gnome':     { name: 'GNOME',        badge: 'Desktop',  desc: 'GNOME desktop environment on a stable Arch base.', de: 'GNOME', disp: 'Wayland', arch: 'x86_64' },
            'plasma':    { name: 'KDE Plasma',   badge: 'Desktop',  desc: 'Full KDE Plasma experience. Beautiful, customizable, powerful.', de: 'KDE Plasma', disp: 'Wayland', arch: 'x86_64' },
            'xfce':      { name: 'XFCE',         badge: 'Desktop',  desc: 'Lightweight, fast, and modular. Great for older hardware.', de: 'XFCE', disp: 'XLibre', arch: 'x86_64' },
            'i3':        { name: 'i3',            badge: 'X11',      desc: 'Tiling window manager for keyboard-driven workflows.', de: 'i3', disp: 'X11', arch: 'x86_64' },
            'sway':      { name: 'Sway',         badge: 'Wayland',  desc: 'i3-compatible Wayland compositor. Tiling done right.', de: 'Sway', disp: 'Wayland', arch: 'x86_64' },
            'mate':      { name: 'MATE',         badge: 'Desktop',  desc: 'Classic GNOME 2 look and feel. Lightweight and familiar.', de: 'MATE', disp: 'XLibre', arch: 'x86_64' },
            'openbox':   { name: 'Openbox',      badge: 'X11',      desc: 'Minimalist stacking window manager. Ultra lightweight.', de: 'Openbox', disp: 'XLibre', arch: 'x86_64' },
            'hyprland':  { name: 'Hyprland',     badge: 'Wayland',  desc: 'Modern Wayland compositor with dynamic tiling and eye candy.', de: 'Hyprland', disp: 'Wayland', arch: 'x86_64' },
            'immutable': { name: 'Immutable',    badge: 'stable',   desc: 'Read-only root with atomic A/B updates. Cannot break the base system.', de: 'Immutable', disp: 'Read-only', arch: 'x86_64' },
          };

          addEventListener('fetch', event => {
            event.respondWith(handle(event.request));
          });

          async function handle(req) {
            const url = new URL(req.url);
            let path = url.pathname.replace(/^\//, '').replace(/\/$/, '');

            // Root → listing page
            if (!path) return listing();

            // Direct ISO request
            const isoMatch = path.match(/^([a-z0-9]+)(?:-latest|-\d{8})?\.iso$/);
            if (isoMatch && EDITIONS[isoMatch[1]]) {
              return serveISO(isoMatch[1], path);
            }

            // /:slug → edition page  
            if (EDITIONS[path]) return editionPage(path);

            // /:slug/download → direct download
            if (path.match(/^[a-z0-9]+\/download$/)) {
              const slug = path.split('/')[0];
              if (EDITIONS[slug]) return serveISO(slug, `${slug}-latest.iso`);
            }

            // 404
            return notFound(path);
          }

          async function serveISO(slug, filename) {
            const r2url = `${R2_PUBLIC}/${filename}`;
            const res = await fetch(r2url);
            if (res.ok || res.status === 200) {
              return new Response(res.body, {
                headers: {
                  'Content-Type': 'application/octet-stream',
                  'Content-Disposition': `attachment; filename="${filename}"`,
                  'Cache-Control': 'public, max-age=86400',
                  'Access-Control-Allow-Origin': '*',
                }
              });
            }
            return new Response(`ISO not available yet. Check back after the next build completes.\n\nStatus: ${res.status}`, {
              status: 404,
              headers: { 'Content-Type': 'text/plain' }
            });
          }

          function listing() {
            let html = '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AcreetionOS Community ISOs</title><style>';
            html += 'body{font-family:system-ui,sans-serif;background:#121212;color:#e5e5e5;max-width:900px;margin:0 auto;padding:2rem 1rem}';
            html += 'h1{color:#2ecc71;font-size:1.8rem}.sub{color:#888;margin:-.5rem 0 2rem}';
            html += '.card{border:1px solid #333;border-radius:10px;padding:1.25rem;margin:.75rem 0;display:flex;justify-content:space-between;align-items:center;transition:border-color .2s}';
            html += '.card:hover{border-color:#2ecc71}.info{flex:1}.info h2{margin:0;font-size:1.1rem}.info .badge{display:inline-block;font-size:.7rem;padding:.15rem .5rem;border-radius:4px;background:rgba(46,204,113,.15);color:#2ecc71;margin-left:.5rem}';
            html += '.info p{color:#888;font-size:.85rem;margin:.25rem 0 0}.dl a{background:#2ecc71;color:#000;padding:.5rem 1rem;border-radius:6px;text-decoration:none;font-weight:600;font-size:.85rem;white-space:nowrap}';
            html += '.dl a:hover{box-shadow:0 0 12px rgba(46,204,113,.3)}';
            html += 'footer{margin-top:3rem;color:#555;font-size:.85rem;text-align:center}footer a{color:#2ecc71;text-decoration:none}';
            html += '</style></head><body>';
            html += '<h1>AcreetionOS Community Editions</h1>';
            html += '<p class="sub">Unofficial community-maintained ISOs. Built weekly via GitHub Actions.</p>';
            for (const [slug, info] of Object.entries(EDITIONS)) {
              html += `<div class="card"><div class="info">`;
              html += `<h2>${info.name} <span class="badge">${info.badge}</span></h2>`;
              html += `<p>${info.desc}</p></div>`;
              html += `<div class="dl"><a href="/${slug}-latest.iso">Download</a></div></div>`;
            }
            html += '<footer>Part of the <a href="https://acreetionos.org">AcreetionOS</a> project. <a href="https://acreetionos.org/unofficial.html">Learn more</a></footer>';
            html += '</body></html>';
            return new Response(html, { headers: { 'Content-Type': 'text/html;charset=utf-8' } });
          }

          function editionPage(slug) {
            const info = EDITIONS[slug];
            const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${info.name} - AcreetionOS Community</title><style>body{font-family:system-ui;background:#121212;color:#e5e5e5;max-width:600px;margin:2rem auto;padding:0 1rem}a{color:#2ecc71}h1{color:#2ecc71}.btn{display:inline-block;background:#2ecc71;color:#000;padding:.75rem 1.5rem;border-radius:8px;text-decoration:none;font-weight:600;margin-top:1rem}.meta{color:#888}</style></head><body>`;
            return new Response(html + `<h1>${info.name}</h1><p class="meta">${info.de} &middot; ${info.disp} &middot; ${info.arch}</p><p>${info.desc}</p><a class="btn" href="/${slug}-latest.iso">Download ${slug}-latest.iso</a><p style="margin-top:2rem"><a href="/">&larr; Back to all editions</a></p></body></html>`, {
              headers: { 'Content-Type': 'text/html;charset=utf-8' }
            });
          }

          function notFound(path) {
            return new Response(`Not Found: ${path}`, { status: 404 });
          }
          JSEOF

          cat > /tmp/meta.json << 'JSONEOF'
          {"body_part":"script","bindings":[],"compatibility_date":"2026-06-20","compatibility_flags":[]}
          JSONEOF

          # Upload worker
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$AID/workers/scripts/dl-proxy" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -F "metadata=@/tmp/meta.json;type=application/json" \
            -F "script=@/tmp/worker.js;type=application/javascript" | jq .

          # Delete old dl routes
          ROUTES=$(curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes")
          for rid in $(echo "$ROUTES" | jq -r '.result[] | select(.pattern | test("dl\\.")) | .id'); do
            curl -s -X DELETE "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes/$rid" \
              -H "Authorization: Bearer $CF_API_TOKEN" | jq .
          done

          # Add route for correct domain
          DL_DOMAIN="dl.acr"$(python3 -c "print('ee')")"tionos.org"
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"pattern\":\"${DL_DOMAIN}/*\",\"script\":\"dl-proxy\"}" | jq .

          echo "=== Done ==="
