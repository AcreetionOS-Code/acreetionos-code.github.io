name: Weekly Build — All Editions
on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6AM UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-all:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition:
          - { name: "Cinnamon", slug: cinnamon, repo: "AcreetionOS-Code/acreetionos", output: "AcreetionOS-1.0-x86_64.iso", patches: "" }
          - { name: "XL (XLibre)", slug: xl, repo: "AcreetionOS-Code/AcreetionOS-Cinnamon-XLibre", output: "AcreetionOS_XL-1.0-x86_64.iso", patches: "" }
          - { name: "32-bit", slug: 32bit, repo: "spivanatalie64/acreetionos32", output: "AcreetionOS32-latest.iso", patches: "" }
          - { name: "Hyprland", slug: hyprland, repo: "spivanatalie64/acreetionos-hyprland", output: "AcreetionOS-Hyprland-latest.iso", patches: "" }
          - { name: "MATE", slug: mate, repo: "spivanatalie64/acreetionos-mate", output: "AcreetionOS-MATE-latest.iso", patches: "" }
          - { name: "GNOME", slug: gnome, repo: "spivanatalie64/acreetionos-gnome", output: "AcreetionOS-GNOME-latest.iso", patches: "" }
          - { name: "Plasma", slug: plasma, repo: "spivanatalie64/acreetionos-plasma", output: "AcreetionOS-Plasma-latest.iso", patches: "" }
          - { name: "XFCE", slug: xfce, repo: "spivanatalie64/acreetionos-xfce", output: "AcreetionOS-XFCE-latest.iso", patches: "" }
          - { name: "Sway", slug: sway, repo: "spivanatalie64/acreetionos-sway", output: "AcreetionOS-Sway-latest.iso", patches: "" }
          - { name: "i3", slug: i3, repo: "spivanatalie64/acreetionos-i3", output: "AcreetionOS-i3-latest.iso", patches: "" }
          - { name: "Openbox", slug: openbox, repo: "spivanatalie64/acreetionos-openbox", output: "AcreetionOS-Openbox-latest.iso", patches: "" }
          - { name: "Immutable Cinnamon", slug: immutable-cinnamon, repo: "AcreetionOS-Code/acreetionos", output: "immutable-cinnamon.iso", patches: "spivanatalie64/immutable" }
          - { name: "Immutable XLibre", slug: immutable-xlibre, repo: "AcreetionOS-Code/AcreetionOS-Cinnamon-XLibre", output: "immutable-xlibre.iso", patches: "spivanatalie64/immutable" }
    steps:
      - uses: actions/checkout@v4

      - name: Checkout edition repo
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.edition.repo }}
          path: src

      - name: Checkout patches repo
        if: matrix.edition.patches != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.edition.patches }}
          path: patches

      - name: Prepare build
        run: |
          if [ -d patches ]; then
            cp patches/configs/immutable-patch.sh src/ 2>/dev/null || true
            [ -d src/airootfs ] && cp patches/configs/immutable-patch.sh src/airootfs/root/ 2>/dev/null || true
          fi
          sed -i 's/sudo //g' src/build.sh 2>/dev/null || true

      - name: Write build start status
        id: start
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          SLUG="${{ matrix.edition.slug }}"
          DATE_TAG=$(date +%Y%m%d)
          echo "slug=${SLUG}" >> $GITHUB_OUTPUT
          echo "date_tag=${DATE_TAG}" >> $GITHUB_OUTPUT
          ISO_NAME="${SLUG}-${DATE_TAG}.iso"
          echo "iso_name=${ISO_NAME}" >> $GITHUB_OUTPUT
          STATUS='{"edition":"${{ matrix.edition.name }}","slug":"'${SLUG}'","status":"building","started":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","run_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}","output":"${{ matrix.edition.output }}","iso_name":"'${ISO_NAME}'"}'
          echo "$STATUS" > /tmp/build-status.json
          if [ -n "$CF_TOKEN" ]; then
            curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/build-status/objects/${SLUG}-status.json" \
              -H "Authorization: Bearer $CF_TOKEN" \
              --data-binary @/tmp/build-status.json \
              -H "Content-Type: application/json" || true
          fi

      - name: Build ISO in Docker (with live log capture)
        id: build
        run: |
          mkdir -p /tmp/iso
          SLUG="${{ matrix.edition.slug }}"
          # Use script(1) to capture full terminal output for live streaming
          script -q -c "
            docker run --privileged --rm \
              -v \$PWD/src:/workspace \
              archlinux:latest \
              bash -c '
                pacman -Syu --noconfirm archiso grub && \
                cd /workspace && \
                chmod +x *.sh 2>/dev/null; \
                bash build.sh 2>&1 || { echo \"BUILD_FAILED\"; exit 1; }
              ' 2>&1
          " /tmp/build-raw.log
          # Extract the log from script wrapper (script adds header/footer)
          tail -n +2 /tmp/build-raw.log | head -n -1 > /tmp/build.log 2>/dev/null || cp /tmp/build-raw.log /tmp/build.log
          # Find and extract ISO
          find . -name '*.iso' -maxdepth 5 | head -5
          ls -la src/out/ 2>/dev/null && cp src/out/*.iso /tmp/iso/ 2>/dev/null || true
          find / -name '*.iso' -maxdepth 5 2>/dev/null | head -5
          ls -la /tmp/iso/ 2>/dev/null || echo "No ISO found"
          if [ -z "$(ls /tmp/iso/*.iso 2>/dev/null)" ]; then
            echo "BUILD_FAILED"
            echo "build_ok=false" >> $GITHUB_OUTPUT
          else
            echo "BUILD_OK"
            echo "build_ok=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload build log to R2 (for live terminal streaming)
        if: always()
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          SLUG="${{ matrix.edition.slug }}"
          LOG_KEY="${SLUG}-build.log"
          if [ -n "$CF_TOKEN" ] && [ -f /tmp/build.log ]; then
            curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/build-status/objects/${LOG_KEY}" \
              -H "Authorization: Bearer $CF_TOKEN" \
              --data-binary @/tmp/build.log \
              -H "Content-Type: text/plain" || echo "Log upload failed"
          fi

      - name: Prepare ISO for upload
        id: iso
        if: steps.build.outputs.build_ok == 'true'
        run: |
          ISO=$(ls /tmp/iso/*.iso 2>/dev/null | head -1)
          if [ -z "$ISO" ]; then
            find / -name '*.iso' -maxdepth 5 -exec cp {} /tmp/iso/ \; 2>/dev/null || true
            ISO=$(ls /tmp/iso/*.iso 2>/dev/null | head -1)
          fi
          if [ -n "$ISO" ]; then
            FINAL="${{ steps.start.outputs.iso_name }}"
            cp "$ISO" "/tmp/${FINAL}"
            echo "iso_path=/tmp/${FINAL}" >> $GITHUB_OUTPUT
            echo "iso_name=${FINAL}" >> $GITHUB_OUTPUT
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload ISO to all mirrors
        if: steps.iso.outputs.ok == 'true'
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
        run: |
          bash scripts/upload-iso.sh \
            "${{ steps.iso.outputs.iso_path }}" \
            "${{ matrix.edition.slug }}" \
            "${{ steps.start.outputs.date_tag }}"

      - name: Update build status in R2
        if: always()
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          SLUG="${{ matrix.edition.slug }}"
          if [ "${{ steps.iso.outputs.ok }}" = "true" ]; then
            STATUS='{"edition":"${{ matrix.edition.name }}","slug":"'${SLUG}'","status":"success","finished":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","run_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}","iso_name":"${{ steps.iso.outputs.iso_name }}","download_url":"https://pub-173a1f638a3b4c95b5f58b09c0b968aa.r2.dev/${{ steps.iso.outputs.iso_name }}"}'
          else
            STATUS='{"edition":"${{ matrix.edition.name }}","slug":"'${SLUG}'","status":"failed","finished":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","run_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
          fi
          echo "$STATUS" > /tmp/build-status.json
          if [ -n "$CF_TOKEN" ]; then
            curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/build-status/objects/${SLUG}-status.json" \
              -H "Authorization: Bearer $CF_TOKEN" \
              --data-binary @/tmp/build-status.json \
              -H "Content-Type: application/json" || true
          fi

  notify:
    needs: [build-all]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print build summary
        run: |
          echo "=== Weekly Build Complete ==="
          echo "All 13 editions: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
