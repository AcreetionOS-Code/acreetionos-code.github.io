name: Secret Scan (prevent accidental commits)

on:
  push:
    branches: [ main ]

jobs:
  scan:
    name: Scan for common secret patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run secret grep
        run: |
          set -e
          # Simple checks for private key patterns and API key-like strings
          if git grep -n --break --heading -I -E "(sk-|AKIA|CLOUDFLARE_API_TOKEN|OPENROUTER_API_KEY|BEGIN RSA PRIVATE KEY|BEGIN PRIVATE KEY)" -- . || true; then
            echo "Potential secret found in repository — failing the job. Inspect the output above."
            exit 1
          fi
