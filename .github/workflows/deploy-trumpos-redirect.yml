name: Deploy TrumpOS Redirect Worker
on:
  push:
    branches: [main]
    paths: [workers/trumpos-redirect.js]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy redirect worker
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/trumpos-redirect" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/javascript" \
            --data-binary @workers/trumpos-redirect.js | python3 -c "import sys,json; r=json.load(sys.stdin); print('✓' if r.get('success') else '✗ Worker deploy failed:', r.get('errors',''))"
      - name: Set route
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=acreetionos.org" \
            -H "Authorization: Bearer $CF_TOKEN" | python3 -c "import sys,json; print(json.load(sys.stdin).get('result',[{}])[0].get('id',''))")
          if [ -n "$ZONE_ID" ]; then
            curl -s -X POST \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"pattern":"acreetionos.org/TrumpOS/*","script":"trumpos-redirect"}' | python3 -c "import sys,json; r=json.load(sys.stdin); print('✓' if r.get('success') else '✗ Route failed:', r.get('errors',''))"
          else
            echo "Could not find zone ID — set CLOUDFLARE_ZONE_ID secret manually"
          fi
