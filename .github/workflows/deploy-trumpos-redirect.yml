name: Deploy TrumpOS Redirect Worker
on:
  push:
    branches: [main]
    paths: [workers/trumpos-redirect.js]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy redirect worker
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/trumpos-redirect" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/javascript" \
            --data-binary @workers/trumpos-redirect.js | python3 -c "import sys,json; r=json.load(sys.stdin); print('✓' if r.get('success') else '✗ Worker deploy failed:', r.get('errors',''))"
      - name: Set routes
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=acreetionos.org" \
            -H "Authorization: Bearer $CF_TOKEN" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('result',[{}])[0].get('id','') if d.get('success') else '')" 2>/dev/null || echo "")
          if [ -z "$ZONE_ID" ]; then
            ZONE_ID="${{ secrets.CLOUDFLARE_ZONE_ID }}"
          fi
          if [ -z "$ZONE_ID" ]; then
            echo "Could not find zone ID. Set CLOUDFLARE_ZONE_ID secret."
            exit 0
          fi
          for PATTERN in "acreetionos.org/TrumpOS/*" "trumpos.acreetionos.org/*"; do
            # Delete existing route first to avoid conflicts
            EXISTING=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" \
              -H "Authorization: Bearer $CF_TOKEN" | python3 -c "
import sys,json
for r in json.load(sys.stdin).get('result',[]):
    if r.get('pattern') == '$PATTERN':
        print(r.get('id'))
            " 2>/dev/null || true)
            [ -n "$EXISTING" ] && curl -s -X DELETE "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes/$EXISTING" \
              -H "Authorization: Bearer $CF_TOKEN" >/dev/null 2>&1 || true
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" \
              -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              --data "{\"pattern\":\"$PATTERN\",\"script\":\"trumpos-redirect\"}" | \
              python3 -c "import sys,json; r=json.load(sys.stdin); print('✓' if r.get('success') else '✗ $PATTERN:', r.get('errors',''))"
          done
