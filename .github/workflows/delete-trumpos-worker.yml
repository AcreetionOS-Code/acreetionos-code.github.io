name: Delete TrumpOS Redirect Worker
on: workflow_dispatch
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Worker and route
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Get zone ID
          ZONE=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=acreetionos.org" \
            -H "Authorization: Bearer $CF_TOKEN" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('result') else '')")
          echo "Zone: $ZONE"
          # Delete route
          if [ -n "$ZONE" ]; then
            for id in $(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE/workers/routes" \
              -H "Authorization: Bearer $CF_TOKEN" | python3 -c "
import sys,json
for r in json.load(sys.stdin).get('result',[]):
    if 'trumpos' in r.get('pattern','') or 'TrumpOS' in r.get('pattern',''):
        print(r['id'])
            " 2>/dev/null || true); do
              curl -s -X DELETE "https://api.cloudflare.com/client/v4/zones/$ZONE/workers/routes/$id" \
                -H "Authorization: Bearer $CF_TOKEN" && echo "Deleted route $id"
            done
          fi
          # Delete worker script
          curl -s -X DELETE "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/scripts/trumpos-redirect" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | python3 -c "import sys,json; r=json.load(sys.stdin); print('✓' if r.get('success') else '✗ Worker delete:', r.get('errors',''))"
