name: Mirror Registry Admin

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'show the registry, remove one mirror by base URL, or init (create bucket + empty registry)'
        required: true
        default: 'show'
        type: choice
        options: [show, remove, init, diagnose, probe, fix-secret, init-real, fix-secret-real, email-route]
      base:
        description: 'Exact base URL to remove (action=remove only)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - name: Registry admin
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TOKEN_GH: ${{ secrets.CLOUDFLARE_TOKEN_GITHUB }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACTION: ${{ inputs.action }}
          BASE: ${{ inputs.base }}
        run: |
          set -e
          BUCKETS="https://api.cloudflare.com/client/v4/accounts/86a77a981dd5e5a634330a4819aaa2e0/r2/buckets"
          URL="$BUCKETS/acreetionos-hosting/objects/mirrors/registry.json"
          if [ "$ACTION" = "email-route" ]; then
            REAL="86a77a981dd5e5a634330a4819aaa2e0"
            ZONE=$(curl -s -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=acreetionos.org" | jq -r '.result[0].id')
            echo "zone found: $([ -n "$ZONE" ] && [ "$ZONE" != "null" ] && echo yes || echo no)"
            echo "--- routing settings raw ---"
            curl -s -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE/email/routing" | jq -c '{success, errors, result: (.result | {enabled, status, name})}'
            echo "--- rules raw status ---"
            curl -s -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE/email/routing/rules" | jq -c '{success, errors, count: (.result | length)}'
            echo "--- account destination addresses ---"
            curl -s -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$REAL/email/routing/addresses" | jq -c '{success, errors, count: (.result | length), verified: [.result[]?.verified]}'
            curl -s -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE/email/routing/rules" -o rules.json
            echo "existing rules: $(jq -r '.result | length' rules.json)"
            DEST=$(jq -c '[.result[] | select(.matchers[]? | .value == "natalie@acreetionos.org") | .actions[] | select(.type == "forward") | .value[]] | unique' rules.json)
            echo "natalie@ forward destinations found: $(echo "$DEST" | jq 'length')"
            if [ "$(echo "$DEST" | jq 'length')" -gt 0 ]; then
              jq -n --argjson dest "$DEST" '{name: "register_mirror intake", enabled: true, matchers: [{type: "literal", field: "to", value: "registermirror@acreetionos.org"}], actions: [{type: "forward", value: $dest}]}' > newrule.json
              curl -s -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" --data-binary @newrule.json "https://api.cloudflare.com/client/v4/zones/$ZONE/email/routing/rules" | jq -c '{success, errors, rule: (.result.name // null), enabled: (.result.enabled // null)}'
            fi
            echo "--- rules after ---"
            curl -s -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE/email/routing/rules" | jq -r '.result[] | .name + " -> " + ([.matchers[]?.value] | join(","))'
          fi
          if [ "$ACTION" = "fix-secret-real" ]; then
            REAL="86a77a981dd5e5a634330a4819aaa2e0"
            jq -n --arg t "$CF_API_TOKEN" '{name:"CLOUDFLARE_API_TOKEN", text:$t, type:"secret_text"}' > secret.json
            curl -s -X PUT -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" --data-binary @secret.json "https://api.cloudflare.com/client/v4/accounts/$REAL/workers/scripts/acreetionos-worker/secrets" | jq -c '{success, errors}'
            echo "--- secret names on REAL worker now ---"
            curl -s -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$REAL/workers/scripts/acreetionos-worker/secrets" | jq -c '{success, names: [.result[]?.name]}'
          fi
          if [ "$ACTION" = "init-real" ]; then
            REAL="86a77a981dd5e5a634330a4819aaa2e0"
            RB="https://api.cloudflare.com/client/v4/accounts/$REAL/r2/buckets"
            echo "--- [API] buckets in REAL account ---"
            curl -s -H "Authorization: Bearer $CF_API_TOKEN" "$RB" | jq -r '.result.buckets[]?.name // (.errors | tostring)'
            echo "--- [GH] buckets in REAL account ---"
            curl -s -H "Authorization: Bearer $CF_TOKEN_GH" "$RB" | jq -r '.result.buckets[]?.name // (.errors | tostring)'
            echo "--- [API] create bucket in REAL account ---"
            curl -s -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" --data '{"name":"acreetionos-hosting"}' "$RB" | jq -c '{success, errors}'
            echo "--- [API] write empty registry in REAL account ---"
            echo '{"mirrors":[],"lastCheck":null}' > registry.empty.json
            curl -s -X PUT -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" --data-binary @registry.empty.json "$RB/acreetionos-hosting/objects/mirrors/registry.json" | jq -c '{success, errors}'
          fi
          if [ "$ACTION" = "fix-secret" ]; then
            jq -n --arg t "$CF_API_TOKEN" '{name:"CLOUDFLARE_API_TOKEN", text:$t, type:"secret_text"}' > secret.json
            curl -s -X PUT -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" --data-binary @secret.json "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/acreetionos-worker/secrets" | jq -c '{success, errors}'
            echo "--- worker CLOUDFLARE_API_TOKEN secret set from the R2-capable token ---"
          fi
          if [ "$ACTION" = "probe" ]; then
            echo '{"mirrors":[],"lastCheck":"PROBE-2026-11-17"}' > registry.probe.json
            curl -s -X PUT -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" --data-binary @registry.probe.json "$URL" | jq -c '{success, errors}'
            echo "--- probe written: lastCheck=PROBE-2026-11-17 ---"
          fi
          if [ "$ACTION" = "diagnose" ]; then
            echo "lenA=$(( ${#CF_API_TOKEN} + 100 )) lenG=$(( ${#CF_TOKEN_GH} + 100 ))"
            echo "--- [API] buckets in CF_ACCOUNT ---"
            curl -s -H "Authorization: Bearer $CF_API_TOKEN" "$BUCKETS" | jq -r '.result.buckets[]?.name // (.errors | tostring)'
            echo "--- [API] buckets in OTHER account 6a46b418508c26278ae2d3373f41da81 ---"
            curl -s -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/6a46b418508c26278ae2d3373f41da81/r2/buckets" | jq -r '.result.buckets[]?.name // (.errors | tostring)'
            echo "--- [API] worker secret names in CF_ACCOUNT ---"
            curl -s -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/acreetionos-worker/secrets" | jq -c '{success, errors, names: [.result[]?.name]}'
            echo "--- [GH] worker secret names in CF_ACCOUNT ---"
            curl -s -H "Authorization: Bearer $CF_TOKEN_GH" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/acreetionos-worker/secrets" | jq -c '{success, errors, names: [.result[]?.name]}'
            echo "--- [GH] worker secret names in OTHER account ---"
            curl -s -H "Authorization: Bearer $CF_TOKEN_GH" "https://api.cloudflare.com/client/v4/accounts/6a46b418508c26278ae2d3373f41da81/workers/scripts/acreetionos-worker/secrets" | jq -c '{success, errors, names: [.result[]?.name]}'
            echo "--- [API] verify own token ---"
            curl -s -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/tokens/verify" | jq -c '{success, errors, status: .result.status}'
          fi
          if [ "$ACTION" = "init" ]; then
            echo "--- creating bucket acreetionos-hosting (ok if it already exists) ---"
            curl -s -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" --data '{"name":"acreetionos-hosting"}' "$BUCKETS"
            echo
          fi
          curl -s -H "Authorization: Bearer $CF_API_TOKEN" "$URL" -o registry.json || true
          echo "--- current registry ---"
          cat registry.json 2>/dev/null || echo "(none)"
          if [ "$ACTION" = "init" ]; then
            if ! grep -q '"mirrors"' registry.json; then
              echo '{"mirrors":[],"lastCheck":null}' > registry.empty.json
              curl -s -X PUT -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" --data-binary @registry.empty.json "$URL"
              echo "--- empty registry written ---"
            else
              echo "--- registry already exists, left untouched ---"
            fi
          fi
          if [ "$ACTION" = "remove" ]; then
            jq --arg b "$BASE" '.mirrors |= map(select(.base != $b))' registry.json > registry.new.json
            curl -s -X PUT -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" --data-binary @registry.new.json "$URL"
            echo "--- removed: $BASE ---"
          fi
