name: Mirror Registry Admin

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'show the registry, or remove one mirror by base URL'
        required: true
        default: 'show'
        type: choice
        options: [show, remove]
      base:
        description: 'Exact base URL to remove (action=remove only)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - name: Registry admin
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACTION: ${{ inputs.action }}
          BASE: ${{ inputs.base }}
        run: |
          set -e
          URL="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/acreetionos-hosting/objects/mirrors/registry.json"
          curl -s -H "Authorization: Bearer $CF_API_TOKEN" "$URL" -o registry.json || true
          echo "--- current registry ---"
          cat registry.json 2>/dev/null || echo "(none)"
          if [ "$ACTION" = "remove" ]; then
            jq --arg b "$BASE" '.mirrors |= map(select(.base != $b))' registry.json > registry.new.json
            curl -s -X PUT -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" --data-binary @registry.new.json "$URL"
            echo "--- removed: $BASE ---"
          fi
