name: Check Zone Status
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-zone:
    runs-on: ubuntu-latest
    steps:
      - name: Check Zone Status
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -x
          ZONE_ID="5b3f8237bfa2518bff375eb8163623a5"
          
          echo "=== Check zone info ==="
          curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID" | jq .
            
          echo "=== Check all zones I can access ==="
          curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones" | jq '.result[] | {name, id, status, paused}'
          
          echo "=== Try setting SSL mode via Workers API ==="
          # Maybe we can use Workers API to set zone settings?
          curl -s -X PATCH \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/ssl" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"value": "full"}' | jq .
          
          echo "=== Done ==="
