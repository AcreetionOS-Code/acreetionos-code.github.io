name: Build AcreetionOS ISO
on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Edition to build'
        required: true
        type: choice
        options:
          - Cinnamon
          - XL (XLibre)
          - 32-bit
          - Hyprland
          - MATE
          - GNOME
          - Plasma
          - XFCE
          - Sway
          - i3
          - Openbox
          - Immutable Cinnamon
          - Immutable XLibre

concurrency:
  group: build-${{ github.event.inputs.edition }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set build parameters
        id: params
        run: |
          case "${{ github.event.inputs.edition }}" in
            "Cinnamon")
              echo "repo=AcreetionOS-Code/acreetionos" >> $GITHUB_OUTPUT
              echo "submodules=false" >> $GITHUB_OUTPUT
              echo "patches_repo=" >> $GITHUB_OUTPUT
              echo "output=AcreetionOS-1.0-x86_64.iso" >> $GITHUB_OUTPUT
              echo "slug=cinnamon" >> $GITHUB_OUTPUT
              echo "build_cmd=bash build.sh" >> $GITHUB_OUTPUT
              echo "sub_path=" >> $GITHUB_OUTPUT
              ;;
            "XL (XLibre)")
              echo "repo=AcreetionOS-Code/AcreetionOS-Cinnamon-XLibre" >> $GITHUB_OUTPUT
              echo "submodules=false" >> $GITHUB_OUTPUT
              echo "patches_repo=" >> $GITHUB_OUTPUT
              echo "output=AcreetionOS_XL-1.0-x86_64.iso" >> $GITHUB_OUTPUT
              echo "slug=xl" >> $GITHUB_OUTPUT
              echo "build_cmd=bash build.sh" >> $GITHUB_OUTPUT
              echo "sub_path=" >> $GITHUB_OUTPUT
              ;;
            "32-bit")
              echo "repo=spivanatalie64/acreetionos32" >> $GITHUB_OUTPUT
              echo "submodules=false" >> $GITHUB_OUTPUT
              echo "patches_repo=" >> $GITHUB_OUTPUT
              echo "output=AcreetionOS32-latest.iso" >> $GITHUB_OUTPUT
              echo "slug=32bit" >> $GITHUB_OUTPUT
              echo "build_cmd=bash build.sh" >> $GITHUB_OUTPUT
              echo "sub_path=" >> $GITHUB_OUTPUT
              ;;
            "Hyprland")
              echo "repo=spivanatalie64/acreetionos-hyprland" >> $GITHUB_OUTPUT
              echo "submodules=false" >> $GITHUB_OUTPUT
              echo "patches_repo=" >> $GITHUB_OUTPUT
              echo "output=AcreetionOS-Hyprland-latest.iso" >> $GITHUB_OUTPUT
              echo "slug=hyprland" >> $GITHUB_OUTPUT
              echo "build_cmd=bash build.sh" >> $GITHUB_OUTPUT
              echo "sub_path=" >> $GITHUB_OUTPUT
              ;;
            "MATE")
              echo "repo=spivanatalie64/acreetionos-mate" >> $GITHUB_OUTPUT
              echo "submodules=false" >> $GITHUB_OUTPUT
              echo "patches_repo=" >> $GITHUB_OUTPUT
              echo "output=AcreetionOS-MATE-latest.iso" >> $GITHUB_OUTPUT
              echo "slug=mate" >> $GITHUB_OUTPUT
              echo "build_cmd=bash build.sh" >> $GITHUB_OUTPUT
              echo "sub_path=" >> $GITHUB_OUTPUT
              ;;
            "GNOME")
              echo "repo=spivanatalie64/acreetionos-gnome" >> $GITHUB_OUTPUT
              echo "submodules=false" >> $GITHUB_OUTPUT
              echo "patches_repo=" >> $GITHUB_OUTPUT
              echo "output=AcreetionOS-GNOME-latest.iso" >> $GITHUB_OUTPUT
              echo "slug=gnome" >> $GITHUB_OUTPUT
              echo "build_cmd=bash build.sh" >> $GITHUB_OUTPUT
              echo "sub_path=" >> $GITHUB_OUTPUT
              ;;
            "Plasma")
              echo "repo=spivanatalie64/acreetionos-plasma" >> $GITHUB_OUTPUT
              echo "submodules=false" >> $GITHUB_OUTPUT
              echo "patches_repo=" >> $GITHUB_OUTPUT
              echo "output=AcreetionOS-Plasma-latest.iso" >> $GITHUB_OUTPUT
              echo "slug=plasma" >> $GITHUB_OUTPUT
              echo "build_cmd=bash build.sh" >> $GITHUB_OUTPUT
              echo "sub_path=" >> $GITHUB_OUTPUT
              ;;
            "XFCE")
              echo "repo=spivanatalie64/acreetionos-xfce" >> $GITHUB_OUTPUT
              echo "submodules=false" >> $GITHUB_OUTPUT
              echo "patches_repo=" >> $GITHUB_OUTPUT
              echo "output=AcreetionOS-XFCE-latest.iso" >> $GITHUB_OUTPUT
              echo "slug=xfce" >> $GITHUB_OUTPUT
              echo "build_cmd=bash build.sh" >> $GITHUB_OUTPUT
              echo "sub_path=" >> $GITHUB_OUTPUT
              ;;
            "Sway")
              echo "repo=spivanatalie64/acreetionos-sway" >> $GITHUB_OUTPUT
              echo "submodules=false" >> $GITHUB_OUTPUT
              echo "patches_repo=" >> $GITHUB_OUTPUT
              echo "output=AcreetionOS-Sway-latest.iso" >> $GITHUB_OUTPUT
              echo "slug=sway" >> $GITHUB_OUTPUT
              echo "build_cmd=bash build.sh" >> $GITHUB_OUTPUT
              echo "sub_path=" >> $GITHUB_OUTPUT
              ;;
            "i3")
              echo "repo=spivanatalie64/acreetionos-i3" >> $GITHUB_OUTPUT
              echo "submodules=false" >> $GITHUB_OUTPUT
              echo "patches_repo=" >> $GITHUB_OUTPUT
              echo "output=AcreetionOS-i3-latest.iso" >> $GITHUB_OUTPUT
              echo "slug=i3" >> $GITHUB_OUTPUT
              echo "build_cmd=bash build.sh" >> $GITHUB_OUTPUT
              echo "sub_path=" >> $GITHUB_OUTPUT
              ;;
            "Openbox")
              echo "repo=spivanatalie64/acreetionos-openbox" >> $GITHUB_OUTPUT
              echo "submodules=false" >> $GITHUB_OUTPUT
              echo "patches_repo=" >> $GITHUB_OUTPUT
              echo "output=AcreetionOS-Openbox-latest.iso" >> $GITHUB_OUTPUT
              echo "slug=openbox" >> $GITHUB_OUTPUT
              echo "build_cmd=bash build.sh" >> $GITHUB_OUTPUT
              echo "sub_path=" >> $GITHUB_OUTPUT
              ;;
            "Immutable Cinnamon")
              echo "repo=AcreetionOS-Code/acreetionos" >> $GITHUB_OUTPUT
              echo "submodules=false" >> $GITHUB_OUTPUT
              echo "patches_repo=spivanatalie64/immutable" >> $GITHUB_OUTPUT
              echo "output=immutable-cinnamon.iso" >> $GITHUB_OUTPUT
              echo "slug=immutable-cinnamon" >> $GITHUB_OUTPUT
              echo "build_cmd=bash build.sh" >> $GITHUB_OUTPUT
              echo "sub_path=" >> $GITHUB_OUTPUT
              ;;
            "Immutable XLibre")
              echo "repo=AcreetionOS-Code/AcreetionOS-Cinnamon-XLibre" >> $GITHUB_OUTPUT
              echo "submodules=false" >> $GITHUB_OUTPUT
              echo "patches_repo=spivanatalie64/immutable" >> $GITHUB_OUTPUT
              echo "output=immutable-xlibre.iso" >> $GITHUB_OUTPUT
              echo "slug=immutable-xlibre" >> $GITHUB_OUTPUT
              echo "build_cmd=bash build.sh" >> $GITHUB_OUTPUT
              echo "sub_path=" >> $GITHUB_OUTPUT
              ;;
          esac

      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.params.outputs.repo }}
          path: src
          submodules: ${{ steps.params.outputs.submodules }}

      - name: Checkout patches repo (if applicable)
        if: steps.params.outputs.patches_repo != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.params.outputs.patches_repo }}
          path: patches

      - name: Write build start status
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          STATUS='{"edition":"${{ github.event.inputs.edition }}","slug":"${{ steps.params.outputs.slug }}","status":"building","started":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","run_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}","output":"${{ steps.params.outputs.output }}"}'
          echo "$STATUS" > /tmp/build-status.json
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/build-status/objects/${{ steps.params.outputs.slug }}-status.json" \
            -H "Authorization: Bearer $CF_TOKEN" \
            --data-binary @/tmp/build-status.json \
            -H "Content-Type: application/json" || echo "R2 status write failed (expected on first run)"

      - name: Prepare build
        run: |
          if [ -d patches ]; then
            cp patches/configs/immutable-patch.sh src/ 2>/dev/null || true
            [ -d src/airootfs ] && cp patches/configs/immutable-patch.sh src/airootfs/root/ 2>/dev/null || true
          fi
          sed -i 's/sudo //g' src/build.sh 2>/dev/null || true

      - name: Build ISO in Docker
        run: |
          mkdir -p /tmp/iso
          docker run --privileged --rm \
            -v $PWD/src:/workspace \
            archlinux:latest \
            bash -c "
              pacman -Syu --noconfirm archiso grub && \
              cd /workspace && \
              chmod +x *.sh 2>/dev/null; \
              bash build.sh 2>&1 || { echo 'BUILD_FAILED'; exit 1; }
            " 2>&1 | tee /tmp/build.log
          find /workspace -name '*.iso' | head -5 || true
          ls -la /workspace/out/ 2>/dev/null && cp /workspace/out/*.iso /tmp/iso/ 2>/dev/null || true
          find / -name '*.iso' -maxdepth 5 2>/dev/null | head -5
          ls -la /tmp/iso/ 2>/dev/null || echo "No ISO found"
          [ -z "$(ls /tmp/iso/*.iso 2>/dev/null)" ] && echo "BUILD_FAILED" || echo "BUILD_OK"

      - name: Prepare ISO
        run: |
          ISO=$(ls /tmp/iso/*.iso 2>/dev/null | head -1)
          if [ -z "$ISO" ]; then
            echo "No ISO produced, searching..."
            find / -name '*.iso' -maxdepth 5 -exec cp {} /tmp/iso/ \; 2>/dev/null || true
            ISO=$(ls /tmp/iso/*.iso 2>/dev/null | head -1)
          fi
          if [ -n "$ISO" ]; then
            DATE=$(date +%Y%m%d)
            SLUG="${{ steps.params.outputs.slug }}"
            FINAL="${SLUG}-${DATE}.iso"
            cp "$ISO" "/tmp/${FINAL}"
            echo "iso_path=/tmp/${FINAL}" >> $GITHUB_OUTPUT
            echo "iso_name=${FINAL}" >> $GITHUB_OUTPUT
            echo "build_ok=true" >> $GITHUB_OUTPUT
          else
            echo "build_ok=false" >> $GITHUB_OUTPUT
          fi
        id: iso

      - name: Upload ISO to R2
        if: steps.iso.outputs.build_ok == 'true'
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          F="${{ steps.iso.outputs.iso_name }}"
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -d '{"name":"acreetionos-builds"}' || true
          U=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/acreetionos-builds/objects/${F}/upload" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -d '{}' | python3 -c "import sys,json; print(json.load(sys.stdin).get('result',{}).get('uploadURL',''))")
          if [ -n "$U" ]; then
            curl -s -X PUT "$U" --data-binary @"/tmp/${F}" && echo "Uploaded $F"
          else
            echo "R2 upload failed, trying direct upload..."
            curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/acreetionos-builds/objects/${F}" \
              -H "Authorization: Bearer $CF_TOKEN" \
              --data-binary @"/tmp/${F}" && echo "Uploaded $F"
          fi

      - name: Update build success status
        if: always()
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "${{ steps.iso.outputs.build_ok }}" = "true" ]; then
            STATUS='{"edition":"${{ github.event.inputs.edition }}","slug":"${{ steps.params.outputs.slug }}","status":"success","finished":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","run_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}","iso_name":"${{ steps.iso.outputs.iso_name }}","download_url":"https://pub-173a1f638a3b4c95b5f58b09c0b968aa.r2.dev/${{ steps.iso.outputs.iso_name }}"}'
          else
            STATUS='{"edition":"${{ github.event.inputs.edition }}","slug":"${{ steps.params.outputs.slug }}","status":"failed","finished":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","run_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
          fi
          echo "$STATUS" > /tmp/build-status.json
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/build-status/objects/${{ steps.params.outputs.slug }}-status.json" \
            -H "Authorization: Bearer $CF_TOKEN" \
            --data-binary @/tmp/build-status.json \
            -H "Content-Type: application/json" || echo "R2 status write failed"
