name: AI PR Auto-Review & Merge
on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Get PR info
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number || inputs.pr_number }}"
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR number" && exit 0
          fi
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
          
          PR_DIFF=$(gh pr diff "$PR_NUMBER" 2>/dev/null | head -500)
          PR_TITLE=$(gh pr view "$PR_NUMBER" --json title --jq '.title' 2>/dev/null)
          PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body' 2>/dev/null)
          
          # Save for AI review
          echo "$PR_DIFF" > /tmp/pr-diff.txt
          echo "title=$PR_TITLE" >> $GITHUB_OUTPUT

      - name: AI Review
        if: steps.pr.outputs.number
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ steps.pr.outputs.number }}"
          PR_TITLE="${{ steps.pr.outputs.title }}"
          
          if [ -z "$OPENROUTER_KEY" ]; then
            echo "No OpenRouter key - cannot review"
            exit 0
          fi
          
          DIFF=$(cat /tmp/pr-diff.txt 2>/dev/null | head -300)
          if [ -z "$DIFF" ]; then
            echo "Empty diff - approving"
            gh pr merge "$PR_NUM" --merge --auto 2>&1 || true
            exit 0
          fi
          
          echo "Reviewing PR #$PR_NUM: $PR_TITLE"
          
          REVIEW=$(curl -s "https://openrouter.ai/api/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENROUTER_KEY" \
            -H "HTTP-Referer: https://acreetionos.org" \
            -d "{
              \"model\": \"meta-llama/llama-3.2-3b-instruct:free\",
              \"messages\": [
                {\"role\": \"system\", \"content\": \"You review PRs for a Linux distro website. Check for: broken HTML, security issues, broken JS, typos. Reply with exactly APPROVE or REJECT followed by reason.\"},
                {\"role\": \"user\", \"content\": $(echo "PR Title: $PR_TITLE\n\nDiff:\n$DIFF" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")}
              ],
              \"max_tokens\": 300
            }" 2>/dev/null | python3 -c "
import sys,json
try:
  d=json.load(sys.stdin)
  print(d.get('choices',[{}])[0].get('message',{}).get('content','APPROVE'))
except: print('APPROVE')
")
          
          echo "AI Review Result:"
          echo "$REVIEW"
          
          # Post review on PR
          if echo "$REVIEW" | grep -qi "^APPROVE"; then
            gh pr review "$PR_NUM" --approve --body "✅ AI reviewed: ${REVIEW:0:200}" 2>/dev/null || true
            echo "✅ Approved by AI"
            # Auto-merge
            gh pr merge "$PR_NUM" --merge --auto 2>&1 || true
          else
            gh pr review "$PR_NUM" --request-changes --body "❌ AI review: ${REVIEW:0:200}" 2>/dev/null || true
            echo "⏸ Changes requested by AI"
          fi
