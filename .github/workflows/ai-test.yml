name: AI Page Review
on:
  push:
    branches: [main]
    paths: ['**.html', '**.css', '**.js']
  schedule:
    - cron: '0 2 * * 6'  # Saturday 02:00 UTC
  workflow_dispatch:

jobs:
  ai-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run AI page review
        env:
          AI_TEST_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_TEST_ENDPOINT: 'https://openrouter.ai/api/v1/chat/completions'
          AI_TEST_MODEL: 'meta-llama/llama-3.2-3b-instruct:free'
        run: python3 tests/ai-review.py
