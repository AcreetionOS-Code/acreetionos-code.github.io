name: Inject API Key

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject OpenRouter key
        run: |
          echo "window.OPENROUTER_KEY = '${{ secrets.OPENROUTER_API_KEY }}';" > aiden-key.js
      - name: Commit and push
        run: |
          git config user.name "key-bot"
          git config user.email "key-bot@acreetionos.org"
          git add aiden-key.js
          git diff --staged --quiet || git commit -m "Update AIDEN API key [skip ci]"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push
