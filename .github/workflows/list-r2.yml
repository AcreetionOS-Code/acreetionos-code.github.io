name: List R2 ISOs
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List ISOs in R2
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -x
          ACCOUNT_ID="6a46b418508c26278ae2d3373f41da81"
          
          # List all R2 buckets
          echo "=== R2 Buckets ==="
          curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/r2/buckets" | jq '.result[] | {name, creation_date}'
          
          # List objects in acreetionos-builds
          echo "=== Objects in acreetionos-builds ==="
          curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/r2/buckets/acreetionos-builds/objects" | jq '.result.objects[] | {key, size, uploaded}'
          
          # List objects in build-status
          echo "=== Objects in build-status ==="
          curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/r2/buckets/build-status/objects" | jq '.result.objects[] | {key, size, uploaded}'
          
          echo "=== Done ==="
