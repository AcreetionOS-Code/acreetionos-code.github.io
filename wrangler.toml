name = "acreetionos-worker"
main = "index.js"
compatibility_date = "2026-04-26"
account_id = "86a77a981dd5e5a634330a4819aaa2e0"

# Workers AI binding — free 10k neurons/day for the wiki guide AI
ai = { binding = "AI" }

# Routes are managed via Cloudflare Dashboard → Workers & Pages → acreetionos-worker → Triggers → Routes
# Route: acreetionos.org/api/*
# Route: wiki.acreetionos.org/api/*
# (acreetionos.org/flash.html route removed 2026-08-25 — the worker proxy
#  served the download page as text/plain, blocking Google indexing.)

[triggers]
# Check every 30 min: verify all ISOs downloadable, auto-fix broken
crons = ["*/30 * * * *"]

[vars]
# Plaintext vars only. Anything sensitive is a SECRET, not a var —
# declaring SECRET_SAUCE / ALERT_SIREN / SCAN_MASTER here as empty vars
# is how they ended up unset in production.
RETURN_ADDRESS = "developers@acreetionos.org"

# Secrets are deployed by .github/workflows/deploy-worker.yml (names must
# match what index.js reads). Verify with `wrangler secret list`:
#   OPENROUTER_API_KEY / BRAIN_JUICE — OpenRouter API key (AI chat + newsletter)
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token (R2 ISO hosting + provider store)
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare Account ID (required for all R2 calls)
#   SECRET_SAUCE  — Admin key for hosting/newsletter admin endpoints
#   ALERT_SIREN   — Discord webhook URL for alerts
#   SCAN_MASTER   — VirusTotal API key for ISO malware scanning
#   GUEST_LIST    — JSON array of allowed CORS origins
#   WATCH_LIST    — JSON array of threat intel keywords
#   GROQ_API_KEY  — (optional) Groq free tier fallback
#   GH_TOKEN      — (optional) GitHub Models free tier fallback
#   RECAPTCHA_API_KEY         — the reCAPTCHA SITE key (public by design;
#       also hardcoded as RECAPTCHA_SITE_KEY in index.js as a fallback)
#   RECAPTCHA_API_SECRET_KEY  — the server-side secret
#
#   ⚠ UNTIL 2026-09-27 the secret was unset and the code failed open, leaving
#   /api/newsletter/subscribe and the three /api/hosting/* write endpoints
#   open to unauthenticated traffic for months. The old comment here said
#   "REQUIRED to enforce reCAPTCHA" and read like it was configured — it was
#   not.
#
#   That is fixed in index.js. Seven actions are reCAPTCHA-gated, split by
#   what they do:
#     writes  (FAIL_CLOSED_ACTIONS) — newsletter/subscribe, hosting/register,
#              hosting/manage, hosting/subscribe. These REFUSE while the
#              secret is unset, because an unauthenticated write is unbounded.
#     reads   — /api/chat, /api/translate. These stay SERVED and rely on rate
#              limiting, since they mutate nothing. An earlier single-flag
#              approach took both offline at once and silently broke the wiki
#              AI guide.
#   RECAPTCHA_FAIL_CLOSED = true is a master override that locks all seven,
#   including the read-only AI endpoints. Leave it false.
#
#   The secret is dispatched on its shape, because the two reCAPTCHA families
#   authenticate differently:
#       AIza…  Google Cloud API key  → Enterprise assessments API
#       6L…    classic v2/v3 secret  → siteverify
#   recaptcha.js loads enterprise.js and emits Enterprise tokens, so an AIza
#   Google Cloud API key is the value that verifies successfully.
#
#   Supplied automatically by .github/workflows/deploy-worker.yml from the
#   GitHub Actions secrets of the same names, on every deploy.
#   `wrangler secret put RECAPTCHA_API_SECRET_KEY` also works.
#
#   GET /api/health/check reports this under "security", with unavailableEndpoints
#   listing the refused writes and unverifiedEndpoints the AI reads.
