name = "acreetionos-worker"
main = "index.js"
compatibility_date = "2026-04-26"
account_id = "86a77a981dd5e5a634330a4819aaa2e0"

# Workers AI binding — free 10k neurons/day for the wiki guide AI
ai = { binding = "AI" }

# Routes are managed via Cloudflare Dashboard → Workers & Pages → acreetionos-worker → Triggers → Routes
# Route: acreetionos.org/api/*
# Route: wiki.acreetionos.org/api/*
# (acreetionos.org/flash.html route removed 2026-08-25 — the worker proxy
#  served the download page as text/plain, blocking Google indexing.)

[triggers]
# Check every 30 min: verify all ISOs downloadable, auto-fix broken
crons = ["*/30 * * * *"]

[vars]
# Plaintext vars only. Anything sensitive is a SECRET, not a var —
# declaring SECRET_SAUCE / ALERT_SIREN / SCAN_MASTER here as empty vars
# is how they ended up unset in production.
RETURN_ADDRESS = "developers@acreetionos.org"

# Secrets are deployed by .github/workflows/deploy-worker.yml (names must
# match what index.js reads). Verify with `wrangler secret list`:
#   OPENROUTER_API_KEY / BRAIN_JUICE — OpenRouter API key (AI chat + newsletter)
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token (R2 ISO hosting + provider store)
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare Account ID (required for all R2 calls)
#   SECRET_SAUCE  — Admin key for hosting/newsletter admin endpoints
#   ALERT_SIREN   — Discord webhook URL for alerts
#   SCAN_MASTER   — VirusTotal API key for ISO malware scanning
#   GUEST_LIST    — JSON array of allowed CORS origins
#   WATCH_LIST    — JSON array of threat intel keywords
#   GROQ_API_KEY  — (optional) Groq free tier fallback
#   GH_TOKEN      — (optional) GitHub Models free tier fallback
#   RECAPTCHA_API_KEY — Google Cloud API key for reCAPTCHA Enterprise
#       assessments (project clean-502708).
#   RECAPTCHA_SECRET_KEY — legacy siteverify secret; alternative to the
#       Enterprise API key.
#
#   ⚠ AS OF 2026-09-27 NEITHER KEY IS SET, and neither exists as a GitHub
#   Actions secret either (verified with `gh secret list`), so there is no
#   key to enforce with. The old comment here said "REQUIRED to enforce
#   reCAPTCHA" and read like it was configured — it was not, and the code
#   failed open silently, leaving /api/newsletter/subscribe and the three
#   /api/hosting/* write endpoints open to unauthenticated traffic for
#   months.
#
#   That is now fixed at the code level: RECAPTCHA_FAIL_CLOSED = true in
#   index.js, so with no key set those four writes are REFUSED rather than
#   accepted. The exposure is closed. The cost is that newsletter signup and
#   hosting registration return "Human verification is temporarily
#   unavailable" until a key exists.
#
#   TO RESTORE SERVICE — set ONE of the two keys, no code change and no
#   redeploy needed beyond the secret (this flag only governs the
#   unconfigured case):
#       wrangler secret put RECAPTCHA_API_KEY     # Enterprise, clean-502708
#       wrangler secret put RECAPTCHA_SECRET_KEY  # legacy siteverify
#   The frontend already collects a token (site key
#   6Lf-EoAtAAAAAI8dwkXHkdisu4eoz1KaZlFMK47w, recaptcha.js, forms send
#   recaptchaToken) — only the server-side key is missing.
#
#   GET /api/health/check reports this under "security": recaptchaMode is
#   "fail-closed" and openEndpoints is empty, while unavailableEndpoints
#   lists the four refused writes.
