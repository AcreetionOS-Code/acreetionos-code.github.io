name = "acreetionos-aiden-proxy"
main = "index.js"
compatibility_date = "2026-04-26"

routes = ["acreetionos.org/api/*", "acreetionos.org/flash.html"]

[triggers]
# Check every 30 min: verify all ISOs downloadable, auto-fix broken
crons = ["*/30 * * * *"]

[vars]
DISCORD_WEBHOOK_URL = ""
ADMIN_KEY = ""
HOSTING_BUCKET = "acreetionos-hosting"
EMAIL_FROM = "developers@acreetionos.org"
VIRUSTOTAL_API_KEY = ""
