name = "acreetionos-worker"
main = "index.js"
compatibility_date = "2026-04-26"

routes = [
  { pattern = "acreetionos.org/api/*", zone_name = "acreetionos.org" },
  { pattern = "acreetionos.org/flash.html", zone_name = "acreetionos.org" },
  { pattern = "darren.acreetionos.org/*", zone_name = "acreetionos.org" },
]

[triggers]
# Check every 30 min: verify all ISOs downloadable, auto-fix broken
crons = ["*/30 * * * *"]

[vars]
ALERT_SIREN = ""
SECRET_SAUCE = ""
RETURN_ADDRESS = "developers@acreetionos.org"
SCAN_MASTER = ""

# Secrets (set via `wrangler secret put` — NOT in this file):
#   BRAIN_JUICE  — OpenRouter API key for AI chat + newsletter generation
#   SPICY_SAUCE  — Cloudflare API token for R2 access
#   TACO_BELL    — Cloudflare Account ID
#   WATCH_LIST   — JSON threat intel keywords list
