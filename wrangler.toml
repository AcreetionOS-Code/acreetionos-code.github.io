name = "acreetionos-worker"
main = "index.js"
compatibility_date = "2026-04-26"
account_id = "6a46b418508c26278ae2d3373f41da81"

# Routes are managed via Cloudflare Dashboard → Workers & Pages → acreetionos-worker → Triggers → Routes
# Route: acreetionos.org/api/*
# Route: acreetionos.org/flash.html

[triggers]
# Check every 30 min: verify all ISOs downloadable, auto-fix broken
crons = ["*/30 * * * *"]

[vars]
ALERT_SIREN = ""
SECRET_SAUCE = ""
RETURN_ADDRESS = "developers@acreetionos.org"
SCAN_MASTER = ""

# Secrets already deployed (check with `wrangler secret list`):
#   OPENROUTER_API_KEY    — OpenRouter API key for AI chat + newsletter generation
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token for R2 access (ISO hosting)
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare Account ID
#   GH_TOKEN              — GitHub API token (for API rate limits)
#
# Required secrets (set if not present: `wrangler secret put <NAME>`):
#   SECRET_SAUCE  — Admin key for hosting provider approval/rejection
#   ALERT_SIREN   — Discord webhook URL for alerts
#   SCAN_MASTER   — VirusTotal API key for ISO malware scanning
#   WATCH_LIST    — JSON array of threat intel keywords
